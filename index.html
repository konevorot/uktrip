<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1a1a1a"/>
<title>🇬🇧 UK Trip · 26.06 — 10.07</title>
<meta property="og:title" content="🇬🇧 Англия и Шотландия · Карта путешествия"/>
<meta property="og:description" content="200+ мест в Лондоне, Эдинбурге и Глазго"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--border:#e8e8e5;--muted:#888;--bg:#f7f6f3;--accent:#1a1a1a;--fav:#e74c3c;--visited:#27ae60;--planned:#3498db;--cal:#8854d0;--sidebar:320px;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);--safe-l:env(safe-area-inset-left);--safe-r:env(safe-area-inset-right);--tab-h:0px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ── */
header{background:#fff;border-bottom:1px solid var(--border);padding:0 14px;padding-top:var(--safe-t);display:flex;align-items:center;gap:10px;min-height:48px;flex-shrink:0;z-index:1000}
header h1{font-size:13px;font-weight:600;white-space:nowrap}
.header-right{display:flex;gap:4px;margin-left:auto;align-items:center}
.city-tabs{display:flex;gap:3px}
.city-tab{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer;transition:.15s;white-space:nowrap}
.city-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hdr-btn{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:3px;margin-left:6px;white-space:nowrap}
.hdr-btn:hover{background:#f5f5f5}
.hdr-btn.on{background:var(--cal);color:#fff;border-color:var(--cal)}

/* ── LAYOUT ── */
.body{display:flex;flex:1;overflow:hidden;position:relative}
aside{width:var(--sidebar);flex-shrink:0;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--border);overflow:hidden}
.search-bar{padding:6px 10px;border-bottom:1px solid var(--border);display:flex;gap:4px;align-items:center}
.search-bar input{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;background:#fafaf8;outline:none}
.search-bar input:focus{border-color:#bbb;background:#fff}
.search-bar select{padding:5px 4px;border:1px solid var(--border);border-radius:8px;font-size:11px;font-family:inherit;background:#fff;cursor:pointer}
.cats{padding:6px 10px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:3px}
.cat-chip{padding:3px 8px;border-radius:12px;border:1px solid;font-size:10px;cursor:pointer;background:#fff;transition:.15s}
.cat-chip.off{opacity:.15}
.cat-ctrl{padding:3px 8px;border-radius:12px;border:1px solid var(--accent);font-size:10px;cursor:pointer;background:var(--accent);color:#fff;font-family:inherit;font-weight:500;flex-shrink:0}
.filter-reset{padding:4px 10px;border-radius:14px;border:1px solid var(--fav);background:#fde8e8;color:var(--fav);font-size:11px;cursor:pointer;font-family:inherit;font-weight:500;transition:.15s;animation:fadeIn .2s}
.filters-bar{padding:5px 10px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:3px;align-items:center;background:#fafaf8}
.filter-btn{padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer;transition:.15s}
.filter-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.date-filter{display:flex;align-items:center;gap:3px;margin-left:auto}
.date-filter label{font-size:9px;color:var(--muted)}
.date-filter input[type=date]{font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:6px;background:#fff;font-family:inherit}
.count-bar{padding:5px 10px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);background:#fafaf8;display:flex;justify-content:space-between;align-items:center}
.add-place-btn{background:var(--accent);color:#fff;border:none;padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer;font-family:inherit}
.places-list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.place-card{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s;position:relative}
.place-card:hover{background:#f9f9f7}
.place-card.active{background:#f0f0ec;border-left:3px solid #333}
.place-card .pname{font-size:13px;font-weight:500;margin-bottom:2px;padding-right:50px}
.place-card .pdesc{font-size:11px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.place-card .pnote{font-size:11px;color:var(--cal);font-style:italic;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-card .ptag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:8px;border:1px solid;margin-bottom:2px;font-weight:500}
.place-card .pcity{font-size:10px;color:#aaa;margin-left:3px}
.links{margin-top:4px;display:flex;gap:8px}
.links a{font-size:11px;color:#0066cc;text-decoration:none}
.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:2px}
.card-action{width:28px;height:28px;border:none;border-radius:50%;background:transparent;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;opacity:.3;transition:.15s}
.card-action:hover{opacity:1;background:rgba(0,0,0,.05)}
.card-action.fav-on{opacity:1;color:var(--fav)}
.card-action.vis-on{opacity:1;color:var(--visited)}
.card-badges{display:flex;gap:3px;align-items:center;margin-bottom:2px;flex-wrap:wrap}
.badge{font-size:9px;padding:1px 5px;border-radius:5px;font-weight:500}
.badge-fav{background:#fde8e8;color:var(--fav)}
.badge-vis{background:#e8f8ef;color:var(--visited)}
.badge-date{background:#e8f0fd;color:var(--planned)}
.badge-custom{background:#f3e8fd;color:#8e44ad}
.badge-note{background:#fff3e0;color:#e67e22}

/* ── MAP ── */
#map{flex:1}
.leaflet-popup-content-wrapper{border-radius:12px;padding:0;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.leaflet-popup-content{margin:0;width:270px!important}
.popup-inner{padding:12px 14px}
.popup-tag{font-size:11px;font-weight:600;margin-bottom:2px}
.popup-name{font-size:14px;font-weight:600;margin-bottom:4px}
.popup-desc{font-size:12px;color:#555;line-height:1.4;margin-bottom:6px}
.popup-note-show{font-size:11px;color:var(--cal);font-style:italic;margin-bottom:6px;padding:5px 8px;background:#f8f4ff;border-radius:6px}
.popup-links{display:flex;gap:10px;padding-top:5px;border-top:1px solid #eee}
.popup-links a{font-size:11px;color:#0066cc;text-decoration:none}
.popup-actions{display:flex;gap:5px;padding-top:6px;border-top:1px solid #eee;margin-top:6px;flex-wrap:wrap;align-items:center}
.popup-action-btn{padding:5px 10px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;font-family:inherit;min-height:32px}
.popup-action-btn.on-fav{background:#fde8e8;border-color:#e7a1a1;color:var(--fav)}
.popup-action-btn.on-vis{background:#e8f8ef;border-color:#a1d4b7;color:var(--visited)}
.popup-date-input{font-size:12px;padding:4px 6px;border:1px solid var(--border);border-radius:10px;font-family:inherit;width:120px;min-height:32px}
.popup-note-input{font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:10px;font-family:inherit;width:100%;margin-top:5px;resize:none;height:38px}

/* ── CALENDAR ── */
.cal-panel{display:none;position:absolute;top:0;right:0;width:370px;height:100%;background:#fff;border-left:1px solid var(--border);box-shadow:-4px 0 20px rgba(0,0,0,.08);z-index:999;overflow-y:auto;flex-direction:column;-webkit-overflow-scrolling:touch}
.cal-panel.show{display:flex}
.cal-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.cal-header h3{font-size:14px;font-weight:600}
.cal-export-btns{display:flex;gap:4px}
.cal-export-btn{padding:4px 12px;border-radius:12px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer;font-family:inherit;min-height:32px}
.cal-day{border-bottom:1px solid var(--border)}
.cal-day-header{padding:10px 14px;background:#fafaf8;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;min-height:44px}
.cal-day-count{font-size:11px;font-weight:400;color:var(--muted);background:var(--border);padding:2px 8px;border-radius:8px}
.cal-day-count.warn{background:#fde8e8;color:var(--fav)}
.cal-day-body.collapsed{display:none}
.cal-place{padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:12px;border-top:1px solid #f0f0ec;cursor:pointer;min-height:44px}
.cal-place .cal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-place .cal-pname{flex:1;font-weight:500}
.cal-place .cal-remove{font-size:16px;cursor:pointer;color:var(--muted);padding:4px 8px}
.cal-empty{padding:10px 14px;font-size:12px;color:#ccc;font-style:italic}
.cal-route-btn{padding:4px 10px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer;font-family:inherit;min-height:32px}
.cal-route-btn.on{background:var(--planned);color:#fff;border-color:var(--planned)}
.cal-unassigned{background:#fff3e0}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:2000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;width:420px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.2);-webkit-overflow-scrolling:touch}
.modal-header{padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:8px;border-radius:8px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:14px 18px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:#999}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.modal-footer{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end}
.modal-btn{padding:10px 20px;border-radius:12px;border:none;font-size:14px;font-family:inherit;cursor:pointer;font-weight:500;min-height:44px}
.modal-btn-cancel{background:#f0f0f0;color:#555}
.modal-btn-save{background:var(--accent);color:#fff}
.modal-btn-delete{background:var(--fav);color:#fff;margin-right:auto}
.click-map-hint{font-size:12px;color:var(--planned);background:#e8f0fd;padding:8px 10px;border-radius:10px;margin-bottom:12px}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

/* ── BOTTOM TAB BAR (mobile only) ── */
.tab-bar{display:none}

/* ══════════════════════════════════════
   MOBILE (iPhone 16 Pro = 402pt wide)
   ══════════════════════════════════════ */
@media(max-width:768px){
  :root{--tab-h:calc(52px + var(--safe-b))}
  header{padding:0 10px;padding-top:var(--safe-t);gap:6px;min-height:44px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  header::-webkit-scrollbar{display:none}
  header h1{font-size:12px;display:none}
  .city-tabs{gap:2px;flex-shrink:0}
  .city-tab{padding:5px 12px;font-size:12px;min-height:32px}
  .hdr-btn{display:none}
  .body{flex-direction:column}

  /* All panels stack, controlled by JS class */
  aside{width:100%;height:100%;position:absolute;top:0;left:0;z-index:500;display:none;padding-bottom:var(--tab-h)}
  aside.mob-active{display:flex}
  #map{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
  .map-wrap.mob-active #map{z-index:400}
  .cal-panel{position:absolute;top:0;left:0;width:100%;height:100%;border:none;box-shadow:none;z-index:500;display:none;padding-bottom:var(--tab-h)}
  .cal-panel.mob-active{display:flex}

  /* Leaflet controls above tab bar */
  .leaflet-bottom{bottom:calc(var(--tab-h) + 8px)!important}

  /* TAB BAR */
  .tab-bar{display:flex;position:fixed;bottom:0;left:0;right:0;height:var(--tab-h);background:#fff;border-top:1px solid var(--border);z-index:2001;padding-bottom:var(--safe-b);align-items:flex-start}
  .tab-bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border:none;background:none;font-family:inherit;font-size:10px;color:var(--muted);cursor:pointer;transition:.15s}
  .tab-bar button .tab-icon{font-size:20px;line-height:1}
  .tab-bar button.tab-on{color:var(--accent);font-weight:600}

  /* Cats horizontal scroll */
  .cats{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 10px}
  .cats::-webkit-scrollbar{display:none}
  .cat-chip{flex-shrink:0;padding:4px 10px;font-size:11px;min-height:28px}
  .cat-ctrl{flex-shrink:0;padding:4px 12px;font-size:11px;min-height:28px}
  .filter-reset{min-height:32px}

  /* Bigger touch targets */
  .filter-btn{padding:5px 12px;font-size:12px;min-height:32px}
  .place-card{padding:12px 14px}
  .place-card .pname{font-size:14px;padding-right:60px}
  .place-card .pdesc{font-size:12px}
  .card-action{width:32px;height:32px;font-size:16px}
  .count-bar{padding:8px 12px;font-size:12px}
  .add-place-btn{padding:6px 14px;font-size:12px;min-height:32px}

  /* Filters */
  .date-filter{margin-left:0;width:100%;margin-top:4px}
  .date-filter input[type=date]{flex:1;font-size:12px;min-height:32px}

  /* Calendar tweaks */
  .cal-header{padding-top:calc(10px + var(--safe-t))}
  .cal-place .cal-remove{opacity:1}

  /* Modal full screen on mobile */
  .modal{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0}
  .modal-header{padding-top:calc(14px + var(--safe-t))}
  .modal-footer{padding-bottom:calc(16px + var(--safe-b))}

  /* Popup wider on mobile */
  .leaflet-popup-content{width:calc(100vw - 60px)!important;max-width:300px}

  /* Search - prevent iOS zoom on focus */
  .search-bar input{font-size:16px}
}
</style>
</head>
<body>
<header>
  <h1>🇬🇧 UK Trip</h1>
  <div class="header-right">
    <div class="city-tabs">
      <button class="city-tab on" onclick="switchCity('both',this)">Все</button>
      <button class="city-tab" onclick="switchCity('london',this)">Лондон</button>
      <button class="city-tab" onclick="switchCity('edinburgh',this)">Эдинбург</button>
      <button class="city-tab" onclick="switchCity('glasgow',this)">Глазго</button>
    </div>
    <button class="hdr-btn" id="calToggle" onclick="toggleCalendar()">📅 Календарь</button>
  </div>
</header>
<div class="body">
  <aside id="listPanel">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 Поиск…" oninput="render()"/>
      <select id="sortSelect" onchange="render()">
        <option value="default">Сорт.</option>
        <option value="name">Имя</option>
        <option value="date">Дата</option>
        <option value="fav">Избр.↑</option>
        <option value="cat">Категория</option>
      </select>
    </div>
    <div class="cats" id="cats">
      <button class="cat-ctrl" id="catAll" onclick="catShowAll()" style="display:none">Все</button>
    </div>
    <div class="filters-bar">
      <button class="filter-btn" id="filterFav" onclick="toggleFilter('fav')">♥ Избранное</button>
      <button class="filter-btn" id="filterVis" onclick="toggleFilter('visited')">✓ Посещено</button>
      <button class="filter-btn" id="filterDate" onclick="toggleFilter('hasDate')">📅 С датой</button>
      <button class="filter-reset" id="filterReset" onclick="resetAllFilters()" style="display:none">✕ Сбросить всё</button>
      <div class="date-filter">
        <label>с</label><input type="date" id="dateFrom" onchange="render()"/>
        <label>по</label><input type="date" id="dateTo" onchange="render()"/>
      </div>
    </div>
    <div class="count-bar"><span id="countText"></span><button class="add-place-btn" onclick="openAddModal()">＋ Добавить</button></div>
    <div class="places-list" id="list"></div>
  </aside>
  <div id="map"></div>
  <div class="cal-panel" id="calPanel">
    <div class="cal-header"><h3>📅 План по дням</h3>
      <div class="cal-export-btns">
        <button class="cal-export-btn" onclick="exportICS()">📥 .ics</button>
        <button class="cal-export-btn" onclick="exportPrint()">🖨 Печать</button>
      </div>
    </div>
    <div id="calBody"></div>
  </div>
</div>

<!-- MOBILE TAB BAR -->
<div class="tab-bar" id="tabBar">
  <button id="tabMap" class="tab-on" onclick="switchMobileView('map')"><span class="tab-icon">🗺</span>Карта</button>
  <button id="tabList" onclick="switchMobileView('list')"><span class="tab-icon">📋</span>Список</button>
  <button id="tabCal" onclick="switchMobileView('cal')"><span class="tab-icon">📅</span>Календарь</button>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header"><h2 id="modalTitle">Добавить место</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="click-map-hint" id="clickHint">📍 Нажмите на карту для координат</div>
      <div class="form-group"><label>Название</label><input type="text" id="fName"/></div>
      <div class="form-group"><label>Описание</label><textarea id="fDesc"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Город</label><select id="fCity"><option value="london">Лондон</option><option value="edinburgh">Эдинбург</option><option value="glasgow">Глазго</option></select></div>
        <div class="form-group"><label>Категория</label><select id="fCat"></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Широта</label><input type="number" step="0.0001" id="fLat"/></div>
        <div class="form-group"><label>Долгота</label><input type="number" step="0.0001" id="fLng"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Сайт</label><input type="url" id="fWebsite"/></div>
        <div class="form-group"><label>Wiki</label><input type="url" id="fWiki"/></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-delete" id="modalDelete" onclick="deleteCustomPlace()" style="display:none">Удалить</button>
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="modal-btn modal-btn-save" onclick="savePlace()">Сохранить</button>
    </div>
  </div>
</div>
<script>
var CATS={theatre:{label:"Театр",color:"#7F77DD"},music:{label:"Музыка",color:"#1D9E75"},festival:{label:"Фестиваль",color:"#D4537E"},museum:{label:"Музей",color:"#378ADD"},art:{label:"Искусство",color:"#D85A30"},arch:{label:"Архитектура",color:"#5B6A8A"},design_shop:{label:"Дизайн/Шоурум",color:"#B0508A"},restaurant:{label:"Рестораны/Еда",color:"#E67E22"},shopping:{label:"Шоппинг",color:"#E91E63"},attraction:{label:"Достопримечательности",color:"#9B59B6"},market:{label:"Рынок/Винтаж",color:"#BA7517"},nature:{label:"Природа",color:"#639922"},district:{label:"Район",color:"#777"},daytrip:{label:"Поездки",color:"#993556"}};

function tripDays(){var days=[],d=new Date(TRIP_START);while(d<=new Date(TRIP_END)){days.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}return days;}
var DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function fmtDay(iso){var d=new Date(iso+'T12:00:00');return DOW[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1);}
function fmtDate(d){if(!d)return'';var p=d.split('-');return p[2]+'.'+p[1];}

var userData={};
function loadUD(){try{var d=localStorage.getItem('uk_map_ud3');if(d)userData=JSON.parse(d);}catch(e){}}

function getUD(k){return userData[k]||{};}
function setUD(k,f,v){if(!userData[k])userData[k]={};userData[k][f]=v;saveUD();}
function placeKey(p){return p.name+'|'+p.lat+'|'+p.lng;}

function switchMobileView(view){

  document.getElementById('listPanel').classList.toggle('mob-active',view==='list');
  document.getElementById('calPanel').classList.toggle('mob-active',view==='cal');
  document.querySelectorAll('.tab-bar button').forEach(function(b){b.classList.remove('tab-on');});
  document.getElementById('tab'+view.charAt(0).toUpperCase()+view.slice(1)).classList.add('tab-on');

function buildCats(){
  var el=document.getElementById('cats');
  Object.keys(CATS).forEach(function(k){
    var v=CATS[k],b=document.createElement('button');
    b.className='cat-chip';b.id='chip-'+k;b.style.borderColor=v.color;b.style.color=v.color;
    b.innerHTML='<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+v.color+';margin-right:2px;vertical-align:1px"></span>'+v.label;
    b.onclick=function(){catClick(k);};
    el.appendChild(b);
  });
}
function catClick(k){
  var keys=Object.keys(CATS);
  var allOn=keys.every(function(c){return activeCats[c];});
  var onlyThisOn=activeCats[k]&&keys.filter(function(c){return activeCats[c];}).length===1;
  if(allOn){
    // Solo mode: show only this category
    keys.forEach(function(c){activeCats[c]=(c===k);});
  }else if(onlyThisOn){
    // If only this one is on, go back to all
    keys.forEach(function(c){activeCats[c]=true;});
  }else{
    // Toggle individual
    activeCats[k]=!activeCats[k];
    // If all turned off, turn all back on
    if(!keys.some(function(c){return activeCats[c];}))
      keys.forEach(function(c){activeCats[c]=true;});
  }
  updateCatChips();render();
}
function catShowAll(){
  Object.keys(CATS).forEach(function(k){activeCats[k]=true;});
  updateCatChips();render();
}
function updateCatChips(){
  var keys=Object.keys(CATS);
  var allOn=keys.every(function(c){return activeCats[c];});
  keys.forEach(function(k){
    var ch=document.getElementById('chip-'+k);
    if(ch)ch.classList.toggle('off',!activeCats[k]);
  });
  var allBtn=document.getElementById('catAll');
  if(allBtn){allBtn.style.display=allOn?'none':'inline-block';}
  updateResetBtn();
}
function toggleFilter(f){
  activeFilters[f]=!activeFilters[f];
  document.getElementById('filter'+(f==='fav'?'Fav':f==='visited'?'Vis':'Date')).classList.toggle('on',activeFilters[f]);
  updateResetBtn();render();
}
function updateResetBtn(){
  var keys=Object.keys(CATS);
  var allCatsOn=keys.every(function(c){return activeCats[c];});
  var anyFilterOn=activeFilters.fav||activeFilters.visited||activeFilters.hasDate;
  var dateFrom=document.getElementById('dateFrom').value;
  var dateTo=document.getElementById('dateTo').value;
  var active=!allCatsOn||anyFilterOn||dateFrom||dateTo;
  var btn=document.getElementById('filterReset');
  if(btn)btn.style.display=active?'inline-block':'none';
}
function resetAllFilters(){
  Object.keys(CATS).forEach(function(k){activeCats[k]=true;});

  document.getElementById('filterDate').classList.remove('on');
  document.getElementById('dateFrom').value='';

}
function buildCatSelect(){var sel=document.getElementById('fCat');Object.keys(CATS).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=CATS[k].label;sel.appendChild(o);});}

function makeIcon(color,isSel,ud){
  var s=isSel?14:9;
  var ring=isSel?'<circle cx="16" cy="16" r="13" fill="none" stroke="'+color+'" stroke-width="2" opacity="0.35"/>':'';
  var heart=(ud&&ud.fav)?'<text x="16" y="6" text-anchor="middle" font-size="8" fill="#e74c3c">♥</text>':'';
  var check=(ud&&ud.visited)?'<text x="16" y="30" text-anchor="middle" font-size="8" fill="#27ae60">✓</text>':'';
  return L.divIcon({className:'',html:'<svg width="32" height="32" viewBox="0 0 32 32">'+ring+'<circle cx="16" cy="16" r="'+s+'" fill="'+color+'" stroke="#fff" stroke-width="2"/>'+heart+check+'</svg>',iconSize:[32,32],iconAnchor:[16,16]});
}
function mkLinks(p,stop){var s=stop?' onclick="event.stopPropagation()"':'',ls=[];if(p.website)ls.push('<a href="'+p.website+'" target="_blank"'+s+'>🌐 Сайт</a>');if(p.wiki)ls.push('<a href="'+p.wiki+'" target="_blank"'+s+'>📖 Wiki</a>');return ls.length?'<div class="'+(stop?'links':'popup-links')+'">'+ls.join('')+'</div>':'';}

function render(){
  Object.keys(markers).forEach(function(i){map.removeLayer(markers[i]);});markers={};
  var list=document.getElementById('list');list.innerHTML='';
  var search=(document.getElementById('searchInput').value||'').toLowerCase();
  var sortMode=document.getElementById('sortSelect').value;
  var dateFrom=document.getElementById('dateFrom').value,dateTo=document.getElementById('dateTo').value;
  var cityLabels={london:'Лондон',edinburgh:'Эдинбург',glasgow:'Глазго'};
  var places=allPlaces(),items=[];

  places.forEach(function(p,i){
    if(!activeCats[p.cat])return;
    if(activeCity!=='both'&&p.city!==activeCity)return;
    var key=placeKey(p),ud=getUD(key);
    if(activeFilters.fav&&!ud.fav)return;
    if(activeFilters.visited&&!ud.visited)return;
    if(activeFilters.hasDate&&!ud.plannedDate)return;
    if(dateFrom&&ud.plannedDate&&ud.plannedDate<dateFrom)return;
    if(dateTo&&ud.plannedDate&&ud.plannedDate>dateTo)return;
    if(search&&p.name.toLowerCase().indexOf(search)===-1&&p.desc.toLowerCase().indexOf(search)===-1&&(CATS[p.cat]?CATS[p.cat].label:'').toLowerCase().indexOf(search)===-1)return;
    items.push({p:p,i:i,ud:ud,key:key});
  });

  if(sortMode==='name')items.sort(function(a,b){return a.p.name.localeCompare(b.p.name);});
  else if(sortMode==='date')items.sort(function(a,b){return(a.ud.plannedDate||'z').localeCompare(b.ud.plannedDate||'z');});
  else if(sortMode==='fav')items.sort(function(a,b){return(b.ud.fav?1:0)-(a.ud.fav?1:0);});
  else if(sortMode==='cat')items.sort(function(a,b){return a.p.cat.localeCompare(b.p.cat);});

  items.forEach(function(item){
    var p=item.p,i=item.i,ud=item.ud,c=CATS[p.cat]?CATS[p.cat].color:'#999',catLabel=CATS[p.cat]?CATS[p.cat].label:p.cat;
    var isSel=selected===i;
    var m=L.marker([p.lat,p.lng],{icon:makeIcon(c,isSel,ud)}).addTo(map);
    var noteHtml=ud.note?'<div class="popup-note-show">📝 '+ud.note+'</div>':'';
    m.bindPopup('<div class="popup-inner"><div class="popup-tag" style="color:'+c+'">'+catLabel+'</div><div class="popup-name">'+p.name+'</div><div class="popup-desc">'+p.desc+'</div>'+noteHtml+mkLinks(p,false)+
      '<div class="popup-actions">'+
      '<button class="popup-action-btn '+(ud.fav?'on-fav':'')+'" onclick="toggleFav('+i+')">'+(ud.fav?'♥ Да':'♡ Избр.')+'</button>'+
      '<button class="popup-action-btn '+(ud.visited?'on-vis':'')+'" onclick="toggleVisited('+i+')">'+(ud.visited?'✓ Было':'○ Было')+'</button>'+
      (p._custom?'<button class="popup-action-btn" onclick="openEditModal('+i+')">✎</button>':'')+
      '<input type="date" class="popup-date-input" value="'+(ud.plannedDate||'')+'" onchange="setDate('+i+',this.value)"/>'+
      '<textarea class="popup-note-input" placeholder="Заметка…" onchange="setNote('+i+',this.value)">'+(ud.note||'')+'</textarea>'+
      '</div></div>',{maxWidth:300});
    (function(idx,mk){mk.on('click',function(){selectPlace(idx);});})(i,m);
    markers[i]=m;

    var badges='';
    if(ud.fav||ud.visited||ud.plannedDate||p._custom||ud.note){
      badges='<div class="card-badges">';
      if(ud.fav)badges+='<span class="badge badge-fav">♥</span>';
      if(ud.visited)badges+='<span class="badge badge-vis">✓</span>';
      if(ud.plannedDate)badges+='<span class="badge badge-date">'+fmtDate(ud.plannedDate)+'</span>';
      if(p._custom)badges+='<span class="badge badge-custom">✦</span>';
      if(ud.note)badges+='<span class="badge badge-note">📝</span>';
      badges+='</div>';
    }
    var card=document.createElement('div');
    card.className='place-card'+(isSel?' active':'');card.id='card-'+i;
    card.innerHTML=badges+'<span class="ptag" style="color:'+c+';border-color:'+c+'">'+catLabel+'</span>'+(activeCity==='both'?'<span class="pcity">'+cityLabels[p.city]+'</span>':'')+'<div class="pname">'+p.name+'</div><div class="pdesc">'+p.desc+'</div>'+(ud.note?'<div class="pnote">📝 '+ud.note+'</div>':'')+mkLinks(p,true)+
      '<div class="card-actions"><button class="card-action'+(ud.fav?' fav-on':'')+'" onclick="event.stopPropagation();toggleFav('+i+')">♥</button><button class="card-action'+(ud.visited?' vis-on':'')+'" onclick="event.stopPropagation();toggleVisited('+i+')">✓</button></div>';
    (function(idx){card.onclick=function(){selectPlace(idx);};})(i);
    list.appendChild(card);
  });
  document.getElementById('countText').textContent='Показано: '+items.length;
  if(calOpen)renderCalendar();
  drawRoute();
}

function selectPlace(idx){
  selected=(selected===idx)?null:idx;
  var p=allPlaces()[idx];
  if(isMobile()&&selected!==null) switchMobileView('map');
  render();
  if(selected!==null){map.setView([p.lat,p.lng],14,{animate:true});if(markers[idx])markers[idx].openPopup();var card=document.getElementById('card-'+idx);if(card)card.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
function switchCity(c,btn){activeCity=c;selected=null;document.querySelectorAll('.city-tab').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');var views={both:{c:[54.5,-2.5],z:6},london:{c:[51.505,-0.11],z:11},edinburgh:{c:[55.953,-3.188],z:12},glasgow:{c:[55.864,-4.252],z:13}};var v=views[c];map.setView(v.c,v.z,{animate:true});render();}
function toggleFav(i){var p=allPlaces()[i],k=placeKey(p),u=getUD(k);setUD(k,'fav',!u.fav);render();}
function toggleVisited(i){var p=allPlaces()[i],k=placeKey(p),u=getUD(k);setUD(k,'visited',!u.visited);render();}
function setDate(i,v){setUD(placeKey(allPlaces()[i]),'plannedDate',v||'');render();}
function setNote(i,v){setUD(placeKey(allPlaces()[i]),'note',v||'');}

function renderCalendar(){
  var body=document.getElementById('calBody');body.innerHTML='';
  var days=tripDays(),places=allPlaces();
  days.forEach(function(day){
    var dp=[];places.forEach(function(p,i){var ud=getUD(placeKey(p));if(ud.plannedDate===day)dp.push({p:p,i:i,ud:ud});});
    var div=document.createElement('div');div.className='cal-day';
    var cnt=dp.length,cntCls=cnt>5?'cal-day-count warn':'cal-day-count';
    var routeBtn=cnt>1?'<button class="cal-route-btn'+(activeRouteDay===day?' on':'')+'" onclick="event.stopPropagation();showDayRoute(\''+day+'\')">🗺 Маршрут</button>':'';
    div.innerHTML='<div class="cal-day-header" onclick="this.nextElementSibling.classList.toggle(\'collapsed\')"><span>'+fmtDay(day)+'</span><span style="display:flex;align-items:center;gap:4px"><span class="'+cntCls+'">'+cnt+'</span>'+routeBtn+'</span></div>';
    var bd=document.createElement('div');bd.className='cal-day-body';
    if(!cnt){bd.innerHTML='<div class="cal-empty">—</div>';}
    else dp.forEach(function(item){
      var c=CATS[item.p.cat]?CATS[item.p.cat].color:'#999';
      var el=document.createElement('div');el.className='cal-place';
      el.innerHTML='<span class="cal-dot" style="background:'+c+'"></span><span class="cal-pname">'+item.p.name+'</span><span class="cal-remove" onclick="event.stopPropagation();setDate('+item.i+',\'\')" title="Убрать">✕</span>';
      el.onclick=function(){selectPlace(item.i);};bd.appendChild(el);
    });
    div.appendChild(bd);body.appendChild(div);
  });
  var un=[];places.forEach(function(p,i){var ud=getUD(placeKey(p));if(ud.fav&&!ud.plannedDate)un.push({p:p,i:i});});
  if(un.length){
    var div=document.createElement('div');div.className='cal-day';
    div.innerHTML='<div class="cal-day-header cal-unassigned" onclick="this.nextElementSibling.classList.toggle(\'collapsed\')"><span>⭐ Без даты</span><span class="cal-day-count">'+un.length+'</span></div>';
    var bd=document.createElement('div');bd.className='cal-day-body';
    un.forEach(function(item){var c=CATS[item.p.cat]?CATS[item.p.cat].color:'#999';var el=document.createElement('div');el.className='cal-place';el.innerHTML='<span class="cal-dot" style="background:'+c+'"></span><span class="cal-pname">'+item.p.name+'</span>';el.onclick=function(){selectPlace(item.i);};bd.appendChild(el);});
    div.appendChild(bd);body.appendChild(div);
  }
}

/* ── ROUTES ── */
function clearRoute(){routeLines.forEach(function(l){map.removeLayer(l);});routeLines=[];}
function showDayRoute(day){
  if(activeRouteDay===day){activeRouteDay=null;clearRoute();renderCalendar();return;}
  activeRouteDay=day;drawRoute();renderCalendar();
  if(isMobile())switchMobileView('map');
}
function drawRoute(){
  clearRoute();if(!activeRouteDay)return;
  var places=allPlaces(),pts=[];
  places.forEach(function(p){var ud=getUD(placeKey(p));if(ud.plannedDate===activeRouteDay)pts.push([p.lat,p.lng]);});
  if(pts.length<2)return;
  var line=L.polyline(pts,{color:'#3498db',weight:3,dashArray:'8 6',opacity:0.7}).addTo(map);routeLines.push(line);
  pts.forEach(function(pt,idx){
    var num=L.divIcon({className:'',html:'<div style="background:#3498db;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)">'+(idx+1)+'</div>',iconSize:[22,22],iconAnchor:[11,11]});
    routeLines.push(L.marker(pt,{icon:num,interactive:false}).addTo(map));
  });
  map.fitBounds(L.latLngBounds(pts).pad(0.15),{animate:true});
}

/* ── EXPORT ── */
function exportICS(){
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//UK Trip//EN','CALSCALE:GREGORIAN'];
  allPlaces().forEach(function(p){
    var ud=getUD(placeKey(p));if(!ud.plannedDate)return;
    var d=ud.plannedDate.replace(/-/g,'');
    lines.push('BEGIN:VEVENT','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+d,'SUMMARY:'+p.name,'DESCRIPTION:'+(p.desc||'').replace(/\n/g,'\\n')+(ud.note?'\\n📝 '+ud.note.replace(/\n/g,'\\n'):''));
    if(p.website)lines.push('URL:'+p.website);
    lines.push('GEO:'+p.lat+';'+p.lng,'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  var blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uk_trip.ics';a.click();
}
function exportPrint(){
  var w=window.open('','_blank');
  var h='<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>UK Trip</title><style>body{font-family:-apple-system,sans-serif;padding:20px;font-size:13px}h1{font-size:18px}h2{font-size:14px;margin:14px 0 4px;padding:4px 8px;background:#f0f0f0;border-radius:6px}.p{padding:4px 0;border-bottom:1px solid #eee}.ct{font-size:10px;padding:1px 6px;border-radius:5px;color:#fff;white-space:nowrap;display:inline-block;margin-right:4px}.n{font-weight:600}.d{color:#666}.nt{color:#8854d0;font-style:italic}</style></head><body>';
  h+='<h1>🇬🇧 UK Trip · 26.06 — 10.07.2026</h1>';
  var days=tripDays(),places=allPlaces();
  days.forEach(function(day){
    var dp=[];places.forEach(function(p){var ud=getUD(placeKey(p));if(ud.plannedDate===day)dp.push({p:p,ud:ud});});
    if(!dp.length)return;
    h+='<h2>'+fmtDay(day)+' ('+dp.length+')</h2>';
    dp.forEach(function(it){var c=CATS[it.p.cat]?CATS[it.p.cat].color:'#999';h+='<div class="p"><span class="ct" style="background:'+c+'">'+(CATS[it.p.cat]?CATS[it.p.cat].label:'')+'</span><span class="n">'+it.p.name+'</span> — <span class="d">'+it.p.desc+'</span>'+(it.ud.note?' <span class="nt">📝 '+it.ud.note+'</span>':'')+'</div>';});
  });
  h+='</body></html>';w.document.write(h);w.document.close();setTimeout(function(){w.print();},400);
}

/* ── MAP CLICK ── */
function onMapClick(e){if(!pickingCoords)return;document.getElementById('fLat').value=e.latlng.lat.toFixed(4);document.getElementById('fLng').value=e.latlng.lng.toFixed(4);document.getElementById('clickHint').innerHTML='✅ Координаты выбраны!';document.getElementById('clickHint').style.background='#e8f8ef';document.getElementById('clickHint').style.color='#27ae60';}

/* ── MODAL ── */
function openAddModal(){editingCustomIdx=-1;document.getElementById('modalTitle').textContent='Добавить место';document.getElementById('modalDelete').style.display='none';['fName','fDesc','fLat','fLng','fWebsite','fWiki'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('fCity').value=activeCity==='both'?'london':activeCity;document.getElementById('fCat').value='restaurant';document.getElementById('clickHint').innerHTML='📍 Нажмите на карту для координат';document.getElementById('clickHint').style.background='#e8f0fd';document.getElementById('clickHint').style.color='#3498db';document.getElementById('modalOverlay').classList.add('show');pickingCoords=true;}
function openEditModal(idx){var p=allPlaces()[idx];if(!p._custom)return;editingCustomIdx=customPlaces.indexOf(p);document.getElementById('modalTitle').textContent='Редактировать';document.getElementById('modalDelete').style.display='inline-block';document.getElementById('fName').value=p.name;document.getElementById('fDesc').value=p.desc;document.getElementById('fCity').value=p.city;document.getElementById('fCat').value=p.cat;document.getElementById('fLat').value=p.lat;document.getElementById('fLng').value=p.lng;document.getElementById('fWebsite').value=p.website||'';document.getElementById('fWiki').value=p.wiki||'';document.getElementById('clickHint').innerHTML='📍 Нажмите на карту для изменения координат';document.getElementById('clickHint').style.background='#e8f0fd';document.getElementById('clickHint').style.color='#3498db';document.getElementById('modalOverlay').classList.add('show');pickingCoords=true;}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');pickingCoords=false;}
function savePlace(){var name=document.getElementById('fName').value.trim();if(!name){alert('Укажите название');return;}var lat=parseFloat(document.getElementById('fLat').value),lng=parseFloat(document.getElementById('fLng').value);if(isNaN(lat)||isNaN(lng)){alert('Укажите координаты');return;}var place={city:document.getElementById('fCity').value,cat:document.getElementById('fCat').value,name:name,desc:document.getElementById('fDesc').value.trim(),lat:lat,lng:lng,_custom:true};var w=document.getElementById('fWebsite').value.trim(),wi=document.getElementById('fWiki').value.trim();if(w)place.website=w;if(wi)place.wiki=wi;if(editingCustomIdx>=0)customPlaces[editingCustomIdx]=place;else customPlaces.push(place);saveCP();closeModal();selected=null;render();}
function deleteCustomPlace(){if(editingCustomIdx<0)return;if(!confirm('Удалить?'))return;customPlaces.splice(editingCustomIdx,1);saveCP();closeModal();selected=null;render();}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
window.addEventListener('load',init);
</script>

function mkLinks(p,stop){var s=stop?' onclick="event.stopPropagation()"':'',ls=[];if(p.website)ls.push('<a href="'+p.website+'" target="_blank"'+s+'>🌐 Сайт</a>');if(p.wiki)ls.push('<a href="'+p.wiki+'" target="_blank"'+s+'>📖 Wiki</a>');ls.push('<a href="https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng+'&travelmode=transit" target="_blank"'+s+'>🚇 Маршрут</a>');return '<div class="'+(stop?'links':'popup-links')+'">'+ls.join('')+'</div>';}

function render(){
  Object.keys(markers).forEach(function(i){map.removeLayer(markers[i]);});markers={};
  if(searchMarker){map.removeLayer(searchMarker);searchMarker=null;}
  var list=document.getElementById('list');
  if(!searchMode) list.innerHTML='';
  var search=(document.getElementById('searchInput').value||'').toLowerCase();
  var sortMode=document.getElementById('sortSelect').value;
  var dateFrom=document.getElementById('dateFrom').value,dateTo=document.getElementById('dateTo').value;
  var cityLabels={london:'Лондон',edinburgh:'Эдинбург',glasgow:'Глазго'};
  var places=allPlaces(),items=[];

  places.forEach(function(p,i){
    if(!activeCats[p.cat])return;
    if(activeCity!=='both'&&p.city!==activeCity)return;
    var key=placeKey(p),ud=getUD(key);
    if(activeFilters.fav&&!ud.fav)return;
    if(activeFilters.visited&&!ud.visited)return;
    if(activeFilters.hasDate&&!ud.plannedDate)return;
    if(dateFrom&&ud.plannedDate&&ud.plannedDate<dateFrom)return;
    if(dateTo&&ud.plannedDate&&ud.plannedDate>dateTo)return;
    if(search&&p.name.toLowerCase().indexOf(search)===-1&&p.desc.toLowerCase().indexOf(search)===-1&&(CATS[p.cat]?CATS[p.cat].label:'').toLowerCase().indexOf(search)===-1)return;
    items.push({p:p,i:i,ud:ud,key:key});
  });

  if(sortMode==='name')items.sort(function(a,b){return a.p.name.localeCompare(b.p.name);});
  else if(sortMode==='date')items.sort(function(a,b){return(a.ud.plannedDate||'z').localeCompare(b.ud.plannedDate||'z');});
  else if(sortMode==='fav')items.sort(function(a,b){return(b.ud.fav?1:0)-(a.ud.fav?1:0);});
  else if(sortMode==='cat')items.sort(function(a,b){return a.p.cat.localeCompare(b.p.cat);});
  else if(sortMode==='near'&&userLat!==null)items.sort(function(a,b){return dist(userLat,userLng,a.p.lat,a.p.lng)-dist(userLat,userLng,b.p.lat,b.p.lng);});

  items.forEach(function(item){
    var p=item.p,i=item.i,ud=item.ud,c=CATS[p.cat]?CATS[p.cat].color:'#999',catLabel=CATS[p.cat]?CATS[p.cat].label:p.cat;
    var isSel=selected===i;
    var m=L.marker([p.lat,p.lng],{icon:makeIcon(c,isSel,ud)}).addTo(map);
    var noteHtml=ud.note?'<div class="popup-note-show">📝 '+ud.note+'</div>':'';
    var effDur=ud.dur||p.dur||60;
    var effPrice=ud.price!==undefined?ud.price:(p.price!==undefined?p.price:1);
    var infoLine='<div style="font-size:11px;color:#888;margin-bottom:5px"><span style="color:'+(effPrice===0?'#27ae60':'#2980b9')+'">'+priceLabel(effPrice)+'</span> · ⏱ '+durLabel(effDur)+'</div>';
    m.bindPopup('<div class="popup-inner"><div class="popup-tag" style="color:'+c+'">'+catLabel+'</div><div class="popup-name">'+p.name+'</div><div class="popup-desc">'+p.desc+'</div>'+infoLine+noteHtml+mkLinks(p,false)+
      '<div class="popup-actions">'+
      '<button class="popup-action-btn '+(ud.fav?'on-fav':'')+'" onclick="toggleFav('+i+')">'+(ud.fav?'♥ Да':'♡ Избр.')+'</button>'+
      '<button class="popup-action-btn '+(ud.visited?'on-vis':'')+'" onclick="toggleVisited('+i+')">'+(ud.visited?'✓ Было':'○ Было')+'</button>'+
      '<a class="popup-action-btn" href="https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng+'&travelmode=transit" target="_blank" style="text-decoration:none">🚇 Маршрут</a>'+
      (p._custom?'<button class="popup-action-btn" onclick="openEditModal('+i+')">✎</button>':'')+
      '<input type="date" class="popup-date-input" value="'+(ud.plannedDate||'')+'" onchange="setDate('+i+',this.value)"/>'+
      '<input type="time" class="popup-date-input" value="'+(ud.plannedTime||'')+'" onchange="setTime('+i+',this.value)" style="width:90px" placeholder="Время"/>'+
      '<select class="popup-select" onchange="setDur('+i+',this.value)" title="Время визита"><option value="">'+(effDur?'⏱'+durLabel(effDur):'⏱ Время')+'</option><option value="15">15м</option><option value="30">30м</option><option value="45">45м</option><option value="60">1ч</option><option value="90">1.5ч</option><option value="120">2ч</option><option value="180">3ч</option><option value="240">полдня</option><option value="480">день</option></select>'+
      '<select class="popup-select" onchange="setPrice('+i+',this.value)" title="Бюджет"><option value="">'+priceLabel(effPrice)+'</option><option value="0">бесплатно</option><option value="1">£</option><option value="2">££</option><option value="3">£££</option></select>'+
      '<textarea class="popup-note-input" placeholder="Заметка…" onchange="setNote('+i+',this.value)">'+(ud.note||'')+'</textarea>'+
      '</div></div>',{maxWidth:300});
    (function(idx,mk){mk.on('click',function(){selectPlace(idx);});})(i,m);
    markers[i]=m;

    if(searchMode) return; // don't add cards in search mode
    var badges='';
    var cardDur=ud.dur||p.dur||60;
    var cardPrice=ud.price!==undefined?ud.price:(p.price!==undefined?p.price:1);
    badges='<div class="card-badges">';
    if(ud.fav)badges+='<span class="badge badge-fav">♥</span>';
    if(ud.visited)badges+='<span class="badge badge-vis">✓</span>';
    if(ud.plannedDate)badges+='<span class="badge badge-date">'+(ud.plannedTime?ud.plannedTime+' · ':'')+fmtDate(ud.plannedDate)+'</span>';
    badges+='<span class="badge '+priceBadgeClass(cardPrice)+'">'+priceLabel(cardPrice)+'</span>';
    badges+='<span class="badge badge-dur">⏱'+durLabel(cardDur)+'</span>';
    if(p._custom)badges+='<span class="badge badge-custom">✦</span>';
    if(ud.note)badges+='<span class="badge badge-note">📝</span>';
    badges+='</div>';
    var card=document.createElement('div');
    card.className='place-card'+(isSel?' active':'');card.id='card-'+i;
    card.innerHTML=badges+'<span class="ptag" style="color:'+c+';border-color:'+c+'">'+catLabel+'</span>'+(activeCity==='both'?'<span class="pcity">'+cityLabels[p.city]+'</span>':'')+'<div class="pname">'+p.name+'</div><div class="pdesc">'+p.desc+'</div>'+(ud.note?'<div class="pnote">📝 '+ud.note+'</div>':'')+mkLinks(p,true)+
      '<div class="card-actions"><button class="card-action'+(ud.fav?' fav-on':'')+'" onclick="event.stopPropagation();toggleFav('+i+')">♥</button><button class="card-action'+(ud.visited?' vis-on':'')+'" onclick="event.stopPropagation();toggleVisited('+i+')">✓</button></div>';
    (function(idx){card.onclick=function(){selectPlace(idx);};})(i);
    list.appendChild(card);
  });
  if(!searchMode) document.getElementById('countText').textContent='Показано: '+items.length;
  // Add "search on map" link if there's a query
  var sq=(document.getElementById('searchInput').value||'').trim();
  if(sq.length>=2&&!searchMode){
    var mapLink=document.createElement('div');mapLink.className='search-back';
    mapLink.innerHTML='🌍 Искать «'+sq+'» на карте (Google, OpenStreetMap)';
    mapLink.onclick=function(){mapSearch();};
    list.appendChild(mapLink);
  }
  if(calOpen)renderCalendar();
  drawRoute();
}

/* ── MAP SEARCH (Nominatim) ── */
var searchMode=false;
var searchMarker=null;
function mapSearch(){
  var q=document.getElementById('searchInput').value.trim();
  if(!q||q.length<2)return;
  var btn=document.getElementById('mapSearchBtn');
  btn.classList.add('loading');btn.textContent='⏳';
  // Bias search to UK
  var url='https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)+'&countrycodes=gb&limit=8&addressdetails=1&accept-language=ru,en';
  fetch(url).then(function(r){return r.json();}).then(function(data){
    btn.classList.remove('loading');btn.textContent='🌍';
    showSearchResults(data,q);
  }).catch(function(){
    btn.classList.remove('loading');btn.textContent='🌍';
    alert('Ошибка поиска. Проверьте интернет.');
  });
}
function showSearchResults(results,query){
  searchMode=true;
  var list=document.getElementById('list');list.innerHTML='';
  // Back button
  var back=document.createElement('div');back.className='search-back';
  back.innerHTML='← Вернуться к списку мест';
  back.onclick=function(){searchMode=false;document.getElementById('searchInput').value='';render();};
  list.appendChild(back);
  // Header
  var hdr=document.createElement('div');hdr.style.cssText='padding:8px 12px;font-size:12px;color:#888;border-bottom:1px solid #e8e8e5';
  hdr.textContent='Результаты для «'+query+'»: '+results.length;
  list.appendChild(hdr);
  if(!results.length){
    var empty=document.createElement('div');empty.style.cssText='padding:20px;text-align:center;color:#ccc;font-size:13px';
    empty.textContent='Ничего не найдено. Попробуйте другой запрос.';
    list.appendChild(empty);return;
  }
  results.forEach(function(r){
    var card=document.createElement('div');card.className='search-result';
    var name=r.display_name.split(',')[0];
    var addr=r.display_name.split(',').slice(1,4).join(',').trim();
    var lat=parseFloat(r.lat),lng=parseFloat(r.lon);
    card.innerHTML='<div class="sr-name">'+name+'</div><div class="sr-addr">'+addr+'</div>'+
      '<div class="sr-actions">'+
        '<button class="sr-btn" onclick="event.stopPropagation();showOnMap('+lat+','+lng+',\''+name.replace(/'/g,"\\'")+'\')">📍 Показать</button>'+
        '<button class="sr-btn sr-btn-add" onclick="event.stopPropagation();addFromSearch(\''+name.replace(/'/g,"\\'")+'\','+lat+','+lng+',\''+addr.replace(/'/g,"\\'")+'\')">➕ Добавить</button>'+
      '</div>';
    card.onclick=function(){showOnMap(lat,lng,name);};
    list.appendChild(card);
  });
  if(isMobile())switchMobileView('list');
}
function showOnMap(lat,lng,name){
  if(searchMarker){map.removeLayer(searchMarker);}
  searchMarker=L.marker([lat,lng],{
    icon:L.divIcon({className:'',html:'<svg width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="#3498db" stroke="#fff" stroke-width="3"/><text x="18" y="23" text-anchor="middle" fill="#fff" font-size="16">?</text></svg>',iconSize:[36,36],iconAnchor:[18,18]})
  }).addTo(map).bindPopup('<div style="padding:8px;font-size:13px"><b>'+name+'</b><br><button onclick="addFromSearchMarker('+lat+','+lng+',\''+name.replace(/'/g,"\\'")+'\')" style="margin-top:6px;padding:4px 12px;border-radius:8px;border:1px solid #1a1a1a;background:#1a1a1a;color:#fff;font-size:12px;cursor:pointer">➕ Добавить на карту</button></div>',{maxWidth:250}).openPopup();
  map.setView([lat,lng],15,{animate:true});
  if(isMobile())switchMobileView('map');
}
function addFromSearch(name,lat,lng,addr){
  if(searchMarker){map.removeLayer(searchMarker);searchMarker=null;}
  searchMode=false;
  openAddModal();
  document.getElementById('fName').value=name;
  document.getElementById('fDesc').value=addr||'';
  document.getElementById('fLat').value=lat.toFixed(4);
  document.getElementById('fLng').value=lng.toFixed(4);
  // Guess city from coordinates
  if(lat>55.8&&lat<56.1&&lng>-4.4&&lng<-4.1)document.getElementById('fCity').value='glasgow';
  else if(lat>55.8&&lat<56.1&&lng>-3.4&&lng<-3.0)document.getElementById('fCity').value='edinburgh';
  else document.getElementById('fCity').value='london';
  document.getElementById('clickHint').innerHTML='✅ Координаты заполнены из поиска. Выберите категорию и сохраните.';
  document.getElementById('clickHint').style.background='#e8f8ef';
  document.getElementById('clickHint').style.color='#27ae60';
}
function addFromSearchMarker(lat,lng,name){addFromSearch(name,lat,lng,'');}
function setDur(i,v){if(v)setUD(placeKey(allPlaces()[i]),'dur',parseInt(v));render();}
function setPrice(i,v){if(v!=='')setUD(placeKey(allPlaces()[i]),'price',parseInt(v));render();}

/* ── GOOGLE MAPS HELPERS ── */
function gmapsDayUrl(dp){
  if(!dp||dp.length<1)return'#';
  var url='https://www.google.com/maps/dir/';
  dp.forEach(function(item){url+=item.p.lat+','+item.p.lng+'/';});
  return url;
}

function toggleCalendar(){
  if(isMobile()){switchMobileView('cal');return;}
  calOpen=!calOpen;document.getElementById('calPanel').classList.toggle('show',calOpen);document.getElementById('calToggle').classList.toggle('on',calOpen);if(calOpen)renderCalendar();
}

function renderCalendar(){
  var body=document.getElementById('calBody');body.innerHTML='';
  var days=tripDays(),places=allPlaces();
  days.forEach(function(day){
    var dp=[];places.forEach(function(p,i){var ud=getUD(placeKey(p));if(ud.plannedDate===day)dp.push({p:p,i:i,ud:ud});});
    // Sort by time: with time first (ascending), then without time
    dp.sort(function(a,b){
      var ta=a.ud.plannedTime||'', tb=b.ud.plannedTime||'';
      if(ta&&!tb)return -1;if(!ta&&tb)return 1;
      return ta.localeCompare(tb);
    });
    var div=document.createElement('div');div.className='cal-day';
    var cnt=dp.length,cntCls=cnt>5?'cal-day-count warn':'cal-day-count';
    var totalMin=0,totalCost=0;
    dp.forEach(function(item){
      var ed=item.ud.dur||item.p.dur||60;
      var ep=item.ud.price!==undefined?item.ud.price:(item.p.price||0);
      totalMin+=ed;totalCost+=priceEstimate(ep);
    });
    var timeStr=totalMin>0?' · ⏱'+durLabel(totalMin):'';
    var costStr=totalCost>0?' · ~£'+totalCost:'';
    var routeBtn=cnt>1?'<button class="cal-route-btn'+(activeRouteDay===day?' on':'')+'" onclick="event.stopPropagation();showDayRoute(\''+day+'\')">🗺</button><a class="cal-route-btn" href="'+gmapsDayUrl(dp)+'" target="_blank" onclick="event.stopPropagation()" style="text-decoration:none">🚇</a>':'';
    div.innerHTML='<div class="cal-day-header" onclick="this.nextElementSibling.classList.toggle(\'collapsed\')"><span>'+fmtDay(day)+(cnt?'<span style="font-weight:400;color:#888;font-size:10px">'+timeStr+costStr+'</span>':'')+'</span><span style="display:flex;align-items:center;gap:4px"><span class="'+cntCls+'">'+cnt+'</span>'+routeBtn+'</span></div>';
    var bd=document.createElement('div');bd.className='cal-day-body';
    if(!cnt){bd.innerHTML='<div class="cal-empty">—</div>';}
    else dp.forEach(function(item){
      var c=CATS[item.p.cat]?CATS[item.p.cat].color:'#999';
      var timeTag=item.ud.plannedTime?'<span style="font-size:10px;color:var(--planned);font-weight:600;min-width:38px">'+item.ud.plannedTime+'</span>':'';
      var el=document.createElement('div');el.className='cal-place';
      el.innerHTML='<span class="cal-dot" style="background:'+c+'"></span>'+timeTag+
        '<span class="cal-pname">'+item.p.name+'</span>'+
        '<input type="time" value="'+(item.ud.plannedTime||'')+'" onclick="event.stopPropagation()" onchange="setTime('+item.i+',this.value)" style="font-size:10px;padding:1px 3px;border:1px solid #e8e8e5;border-radius:6px;width:70px;min-height:28px;font-family:inherit" title="Время"/>'+
        '<span class="cal-remove" onclick="event.stopPropagation();setDate('+item.i+',\'\')" title="Убрать">✕</span>';
      el.onclick=function(){selectPlace(item.i);};bd.appendChild(el);
    });
    div.appendChild(bd);body.appendChild(div);
  });
  var un=[];places.forEach(function(p,i){var ud=getUD(placeKey(p));if(ud.fav&&!ud.plannedDate)un.push({p:p,i:i});});
  if(un.length){
    var div=document.createElement('div');div.className='cal-day';
    div.innerHTML='<div class="cal-day-header cal-unassigned" onclick="this.nextElementSibling.classList.toggle(\'collapsed\')"><span>⭐ Без даты</span><span class="cal-day-count">'+un.length+'</span></div>';
    var bd=document.createElement('div');bd.className='cal-day-body';
    un.forEach(function(item){var c=CATS[item.p.cat]?CATS[item.p.cat].color:'#999';var el=document.createElement('div');el.className='cal-place';el.innerHTML='<span class="cal-dot" style="background:'+c+'"></span><span class="cal-pname">'+item.p.name+'</span>';el.onclick=function(){selectPlace(item.i);};bd.appendChild(el);});
    div.appendChild(bd);body.appendChild(div);
  }
}

/* ── ROUTES ── */
function clearRoute(){routeLines.forEach(function(l){map.removeLayer(l);});routeLines=[];}
function showDayRoute(day){
  if(activeRouteDay===day){activeRouteDay=null;clearRoute();renderCalendar();return;}
  activeRouteDay=day;drawRoute();renderCalendar();
  if(isMobile())switchMobileView('map');
}
function drawRoute(){
  clearRoute();if(!activeRouteDay)return;
  var places=allPlaces(),pts=[];
  places.forEach(function(p){var ud=getUD(placeKey(p));if(ud.plannedDate===activeRouteDay)pts.push([p.lat,p.lng]);});
  if(pts.length<2)return;
  var line=L.polyline(pts,{color:'#3498db',weight:3,dashArray:'8 6',opacity:0.7}).addTo(map);routeLines.push(line);
  pts.forEach(function(pt,idx){
    var num=L.divIcon({className:'',html:'<div style="background:#3498db;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)">'+(idx+1)+'</div>',iconSize:[22,22],iconAnchor:[11,11]});
    routeLines.push(L.marker(pt,{icon:num,interactive:false}).addTo(map));
  });
  map.fitBounds(L.latLngBounds(pts).pad(0.15),{animate:true});
}

/* ── EXPORT ── */
function exportICS(){
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//UK Trip//EN','CALSCALE:GREGORIAN'];
  allPlaces().forEach(function(p){
    var ud=getUD(placeKey(p));if(!ud.plannedDate)return;
    var d=ud.plannedDate.replace(/-/g,'');
    lines.push('BEGIN:VEVENT','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+d,'SUMMARY:'+p.name,'DESCRIPTION:'+(p.desc||'').replace(/\n/g,'\\n')+(ud.note?'\\n📝 '+ud.note.replace(/\n/g,'\\n'):''));
    if(p.website)lines.push('URL:'+p.website);
    lines.push('GEO:'+p.lat+';'+p.lng,'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  var blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uk_trip.ics';a.click();
}
function exportPrint(){
  var w=window.open('','_blank');
  var h='<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>UK Trip</title><style>body{font-family:-apple-system,sans-serif;padding:20px;font-size:13px}h1{font-size:18px}h2{font-size:14px;margin:14px 0 4px;padding:4px 8px;background:#f0f0f0;border-radius:6px}.p{padding:4px 0;border-bottom:1px solid #eee}.ct{font-size:10px;padding:1px 6px;border-radius:5px;color:#fff;white-space:nowrap;display:inline-block;margin-right:4px}.n{font-weight:600}.d{color:#666}.nt{color:#8854d0;font-style:italic}</style></head><body>';
  h+='<h1>🇬🇧 UK Trip · 26.06 — 10.07.2026</h1>';
  var days=tripDays(),places=allPlaces();
  days.forEach(function(day){
    var dp=[];places.forEach(function(p){var ud=getUD(placeKey(p));if(ud.plannedDate===day)dp.push({p:p,ud:ud});});
    if(!dp.length)return;
    h+='<h2>'+fmtDay(day)+' ('+dp.length+')</h2>';
    dp.forEach(function(it){var c=CATS[it.p.cat]?CATS[it.p.cat].color:'#999';h+='<div class="p"><span class="ct" style="background:'+c+'">'+(CATS[it.p.cat]?CATS[it.p.cat].label:'')+'</span><span class="n">'+it.p.name+'</span> — <span class="d">'+it.p.desc+'</span>'+(it.ud.note?' <span class="nt">📝 '+it.ud.note+'</span>':'')+'</div>';});
  });
  h+='</body></html>';w.document.write(h);w.document.close();setTimeout(function(){w.print();},400);
}

/* ── MAP CLICK ── */
function onMapClick(e){if(!pickingCoords)return;document.getElementById('fLat').value=e.latlng.lat.toFixed(4);document.getElementById('fLng').value=e.latlng.lng.toFixed(4);document.getElementById('clickHint').innerHTML='✅ Координаты выбраны!';document.getElementById('clickHint').style.background='#e8f8ef';document.getElementById('clickHint').style.color='#27ae60';}

/* ── MODAL ── */
function openAddModal(){editingCustomIdx=-1;document.getElementById('modalTitle').textContent='Добавить место';document.getElementById('modalDelete').style.display='none';['fName','fDesc','fLat','fLng','fWebsite','fWiki'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('fCity').value=activeCity==='both'?'london':activeCity;document.getElementById('fCat').value='restaurant';document.getElementById('fDur').value='60';document.getElementById('fPrice').value='1';document.getElementById('clickHint').innerHTML='📍 Нажмите на карту для координат';document.getElementById('clickHint').style.background='#e8f0fd';document.getElementById('clickHint').style.color='#3498db';document.getElementById('modalOverlay').classList.add('show');pickingCoords=true;}
function openEditModal(idx){var p=allPlaces()[idx];if(!p._custom)return;editingCustomIdx=customPlaces.indexOf(p);document.getElementById('modalTitle').textContent='Редактировать';document.getElementById('modalDelete').style.display='inline-block';document.getElementById('fName').value=p.name;document.getElementById('fDesc').value=p.desc;document.getElementById('fCity').value=p.city;document.getElementById('fCat').value=p.cat;document.getElementById('fLat').value=p.lat;document.getElementById('fLng').value=p.lng;document.getElementById('fWebsite').value=p.website||'';document.getElementById('fWiki').value=p.wiki||'';document.getElementById('fDur').value=p.dur||60;document.getElementById('fPrice').value=p.price!==undefined?p.price:1;document.getElementById('clickHint').innerHTML='📍 Нажмите на карту для изменения координат';document.getElementById('clickHint').style.background='#e8f0fd';document.getElementById('clickHint').style.color='#3498db';document.getElementById('modalOverlay').classList.add('show');pickingCoords=true;}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');pickingCoords=false;}
function savePlace(){var name=document.getElementById('fName').value.trim();if(!name){alert('Укажите название');return;}var lat=parseFloat(document.getElementById('fLat').value),lng=parseFloat(document.getElementById('fLng').value);if(isNaN(lat)||isNaN(lng)){alert('Укажите координаты');return;}var place={city:document.getElementById('fCity').value,cat:document.getElementById('fCat').value,name:name,desc:document.getElementById('fDesc').value.trim(),lat:lat,lng:lng,_custom:true,dur:parseInt(document.getElementById('fDur').value)||60,price:parseInt(document.getElementById('fPrice').value)||0};var w=document.getElementById('fWebsite').value.trim(),wi=document.getElementById('fWiki').value.trim();if(w)place.website=w;if(wi)place.wiki=wi;if(editingCustomIdx>=0)customPlaces[editingCustomIdx]=place;else customPlaces.push(place);saveCP();closeModal();selected=null;render();}
function deleteCustomPlace(){if(editingCustomIdx<0)return;if(!confirm('Удалить?'))return;customPlaces.splice(editingCustomIdx,1);saveCP();closeModal();selected=null;render();}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
window.addEventListener('load',init);

  {city:"london",cat:"market",name:"Spitalfields Market",desc:"Под викторианской крышей 1887 года: мода, антиквариат, еда, ремёсла. Четверг — лучший день для винтажа. Ежедневно, но выходные — насыщеннее. Рядом с Brick Lane, можно обойти оба за утро",lat:51.5196,lng:-0.0749,wiki:"https://en.wikipedia.org/wiki/Old_Spitalfields_Market",website:"https://oldspitalfieldsmarket.com",dur:90,price:0},
  {city:"london",cat:"market",name:"Broadway Market",desc:"Субботний рынок для местных, не для туристов: фермерские сыры, свежая выпечка, специализированный кофе, винил, книги. Hackney. Вдоль канала Regent's — после рынка гуляйте по набережной",lat:51.5413,lng:-0.0563,wiki:"https://en.wikipedia.org/wiki/Broadway_Market,_London",website:"https://broadwaymarket.co.uk",dur:90,price:0},
  {city:"london",cat:"market",name:"Maltby Street Market",desc:"Гастро-рынок под железнодорожными арками Bermondsey: сыры Neal's Yard, вино, устрицы, копчёная рыба. Суббота утром. Менее многолюдно, чем Borough Market, и более аутентично",lat:51.5012,lng:-0.0795,website:"https://www.maltby.st",dur:90,price:0},
  {city:"london",cat:"nature",name:"Hampstead Heath",desc:"320 га дикой природы в черте города: луга, леса, пруды для плавания (есть отдельные для мужчин, женщин и смешанный). Parliament Hill — лучший панорамный вид на весь Лондон. Бесплатно. Полдня минимум",lat:51.5608,lng:-0.1577,wiki:"https://en.wikipedia.org/wiki/Hampstead_Heath",website:"https://www.cityoflondon.gov.uk/hampstead",dur:180,price:0},
  {city:"london",cat:"nature",name:"Richmond Park",desc:"1000 га, 630 оленей свободно бродят прямо рядом с вами. Самый большой королевский парк Лондона. Plantation Isabella — рододендроны в мае–июне. Велосипед напрокат у входа. Полдня",lat:51.4408,lng:-0.2812,wiki:"https://en.wikipedia.org/wiki/Richmond_Park",website:"https://www.royalparks.org.uk/parks/richmond-park",dur:180,price:0},
  {city:"london",cat:"nature",name:"Regent's Park",desc:"Розовый сад Queen Mary's Garden — 12 000 роз 85 сортов, июнь–июль — пик цветения. Озеро с лодками, театр под открытым небом, вид на мечеть. Бесплатно. Совмещайте с Primrose Hill",lat:51.5313,lng:-0.1536,wiki:"https://en.wikipedia.org/wiki/Regent%27s_Park",website:"https://www.royalparks.org.uk/parks/the-regents-park",dur:120,price:0},
  {city:"london",cat:"nature",name:"Highgate Cemetery",desc:"Готическое викторианское кладбище: заросшие склепы, ангелы, египетская аллея. Могила Карла Маркса. Западная часть — только с экскурсией (£18), восточная — самостоятельно (£5). Атмосферно",lat:51.5683,lng:-0.1457,wiki:"https://en.wikipedia.org/wiki/Highgate_Cemetery",website:"https://highgatecemetery.org",dur:120,price:0},
  {city:"london",cat:"nature",name:"Holland Park",desc:"Секретный сад Лондона: японский Kyoto Garden с водопадом и карпами, павлины гуляют по газонам, оранжерея. Kensington. Гораздо тише Гайд-парка. Совмещайте с Leighton House через дорогу",lat:51.5021,lng:-0.2027,wiki:"https://en.wikipedia.org/wiki/Holland_Park",website:"https://www.rbkc.gov.uk/leisure-and-culture/parks/holland-park",dur:120,price:0},
  {city:"london",cat:"nature",name:"Greenwich Park",desc:"Королевский парк на холме: Королевская обсерватория (нулевой меридиан — можно встать одной ногой в каждом полушарии), панорама на Canary Wharf и Темзу. Морской музей внизу — бесплатно",lat:51.4769,lng:-0.0005,wiki:"https://en.wikipedia.org/wiki/Greenwich_Park",website:"https://www.royalparks.org.uk/parks/greenwich-park",dur:120,price:0},
  {city:"london",cat:"nature",name:"Victoria Park",desc:"«Народный парк» East End с 1845 года: два озера, китайская пагода, летние фестивали. Hackney. Менее ухоженный, чем королевские парки, зато живой — здесь отдыхают местные",lat:51.5363,lng:-0.0381,wiki:"https://en.wikipedia.org/wiki/Victoria_Park,_London",dur:120,price:0},
  {city:"london",cat:"nature",name:"Battersea Park",desc:"Парк на берегу Темзы: субтропический сад, буддийская Peace Pagoda, озеро с лодками, детский зоопарк. Рядом с Battersea Power Station — совмещайте. Хороший пикниковый парк",lat:51.4816,lng:-0.1562,wiki:"https://en.wikipedia.org/wiki/Battersea_Park",dur:120,price:0},
  {city:"london",cat:"nature",name:"Epping Forest",desc:"Древний лес 2400 га на границе Лондона: 50 000 деревьев, некоторым 1000+ лет. Олени, пруды, тропинки. Побег из города на полдня. Queen Elizabeth's Hunting Lodge (1543) — бесплатно",lat:51.6462,lng:0.0550,wiki:"https://en.wikipedia.org/wiki/Epping_Forest",website:"https://www.cityoflondon.gov.uk/things-to-do/green-spaces/epping-forest",dur:240,price:0},
  {city:"london",cat:"district",name:"Clerkenwell",desc:"Негласная столица дизайна Лондона: шоурумы Vitra, Fritz Hansen, Kvadrat. Средневековые переулки, пабы XII века (Ye Olde Mitre), кофейни третьей волны. Для прогулки — Exmouth Market",lat:51.5240,lng:-0.1050,wiki:"https://en.wikipedia.org/wiki/Clerkenwell",dur:120,price:0},
  {city:"london",cat:"district",name:"Shoreditch & Brick Lane",desc:"Стрит-арт на каждом углу, бенгальские карри, винтажные магазины, галереи в бывших складах, ночные бары. Мультикультурный, шумный, творческий. Лучше всего в воскресенье (рынки) или вечером (бары)",lat:51.5224,lng:-0.0735,wiki:"https://en.wikipedia.org/wiki/Shoreditch",dur:120,price:0},
  {city:"london",cat:"district",name:"Southbank",desc:"Культурная набережная 2 км: Tate Modern → Shakespeare's Globe → National Theatre → BFI → Hayward Gallery → London Eye. Уличные артисты, книжный рынок под мостом, скейт-парк. Гуляйте вечером — подсветка",lat:51.5054,lng:-0.1047,wiki:"https://en.wikipedia.org/wiki/South_Bank",dur:120,price:0},
  {city:"london",cat:"district",name:"Soho",desc:"Энергетический центр Лондона: театры, бары, ЛГБТ-район (Old Compton St), китайский квартал, рекорд-шопы (Sister Ray), итальянские кафе. Тесные переулки, всегда людно. Вечерняя прогулка обязательна",lat:51.5130,lng:-0.1358,wiki:"https://en.wikipedia.org/wiki/Soho",dur:120,price:0},
  {city:"london",cat:"district",name:"Notting Hill",desc:"Цветные пастельные дома Portobello Road, антикварный рынок по субботам, независимые книжные (тот самый из фильма), кафе на тихих улочках. Красиво и фотогенично, но многолюдно в выходные",lat:51.5127,lng:-0.2039,wiki:"https://en.wikipedia.org/wiki/Notting_Hill",dur:120,price:0},
  {city:"london",cat:"district",name:"Camden",desc:"Панк-рынок, каналы с лодками, живая музыка в каждом пабе, стрит-фуд из 50 стран. Яркий, шумный, немного безумный. Lock Market — многоуровневый рынок в бывших конюшнях. Гуляйте вдоль канала до Little Venice",lat:51.5390,lng:-0.1426,wiki:"https://en.wikipedia.org/wiki/Camden_Town",dur:120,price:0},
  {city:"london",cat:"district",name:"Bermondsey / SE1",desc:"Арт-квартал: White Cube, Fashion and Textile Museum, Maltby Street Market, склады-галереи под жд-арками. Менее туристичный, чем Shoreditch, более сырой и настоящий. Суббота — лучший день",lat:51.5001,lng:-0.0850,wiki:"https://en.wikipedia.org/wiki/Bermondsey",dur:120,price:0},
  {city:"london",cat:"district",name:"Lamb's Conduit Street",desc:"Одна из последних улиц Лондона без сетевых брендов: Darkroom, Pentreath & Hall, Folk, Persephone Books, The Lamb (паб 1720-х). Bloomsbury. 10 минут неторопливой прогулки — и вы влюбитесь",lat:51.5205,lng:-0.1185,dur:120,price:0},
  {city:"london",cat:"daytrip",name:"Bath",desc:"1ч 20 мин поездом. Римские бани I века (можно попробовать воду), георгианские полумесяцы (Royal Crescent), Thermae Bath Spa — единственный горячий источник UK где можно купаться. Бассейн на крыше с видом на город",lat:51.3811,lng:-2.3590,wiki:"https://en.wikipedia.org/wiki/Bath,_Somerset",website:"https://visitbath.co.uk",dur:480,price:2},
  {city:"london",cat:"daytrip",name:"Brighton",desc:"1 час поездом. Пирс с аттракционами, Royal Pavilion (безумный индийский дворец короля), The Lanes (лабиринт винтажных магазинов), стрит-арт North Laine. Рыба с картошкой на пляже. Поезда каждые 15 мин",lat:50.8225,lng:-0.1372,wiki:"https://en.wikipedia.org/wiki/Brighton",website:"https://www.visitbrighton.com",dur:480,price:1},
  {city:"london",cat:"daytrip",name:"Cambridge",desc:"50 мин поездом. Колледжи с готическими дворами (King's College Chapel — обязательно), пантинг по реке Кем (£20/час), Fitzwilliam Museum (бесплатно). Город-парк, тише и зеленее Оксфорда",lat:52.2053,lng:0.1218,wiki:"https://en.wikipedia.org/wiki/Cambridge",website:"https://www.visitcambridge.org",dur:480,price:1},
  {city:"london",cat:"daytrip",name:"Oxford",desc:"1 час поездом. Бодлианская библиотека (Divinity School из Гарри Поттера), Ashmolean Museum (старейший в мире, бесплатно), 38 колледжей. Christ Church — собор + колледж + сад за одну входную плату",lat:51.7520,lng:-1.2577,wiki:"https://en.wikipedia.org/wiki/Oxford",website:"https://www.experienceoxfordshire.org",dur:480,price:1},
  {city:"london",cat:"daytrip",name:"Windsor",desc:"30 мин поездом. Крупнейший обитаемый замок в мире (1000 лет!): королевские покои, часовня Св. Георгия, смена караула. Long Walk — 4 км прямая аллея к замку. £30, аудиогид включён",lat:51.4839,lng:-0.6044,wiki:"https://en.wikipedia.org/wiki/Windsor_Castle",website:"https://www.rct.uk/visit/windsor-castle",dur:480,price:2},
  {city:"london",cat:"daytrip",name:"Whitstable",desc:"1ч 10 мин поездом. Устричный городок на берегу: свежайшие устрицы в хижинах у воды (от £8), галечный пляж, цветные рыбацкие домики, независимые магазины. Самый аутентичный seaside day out",lat:51.3617,lng:1.0261,wiki:"https://en.wikipedia.org/wiki/Whitstable",dur:480,price:2},
  {city:"london",cat:"daytrip",name:"Cotswolds",desc:"~2 часа на машине/автобусе. Медово-каменные деревни из открытки: Bourton-on-the-Water («Венеция Котсуолдса»), Bibury (самая красивая деревня Англии по Уильяму Моррису), Stow-on-the-Wold. Зелёные холмы, овцы, пабы",lat:51.8333,lng:-1.7000,wiki:"https://en.wikipedia.org/wiki/Cotswolds",website:"https://www.cotswolds.com",dur:480,price:1},
  /* ── LONDON · RESTAURANTS ── */
  {city:"london",cat:"restaurant",name:"Dishoom",desc:"Культовый ресторан в стиле бомбейских иранских кафе 1960-х. Завтрак — лучший в Лондоне: bacon naan roll (£9), яйца на паратхе. Несколько локаций, очереди с утра. Covent Garden — самый атмосферный",lat:51.5147,lng:-0.1246,wiki:"https://en.wikipedia.org/wiki/Dishoom",website:"https://www.dishoom.com",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"Sketch",desc:"Розовый зал для afternoon tea — каждое кресло как арт-объект, туалет-яйцо. Дорого (£45–80), но это опыт. Для фото и Instagram. Mayfair. Бронировать за 2–3 недели",lat:51.5147,lng:-0.1413,wiki:"https://en.wikipedia.org/wiki/Sketch_(restaurant)",website:"https://sketch.london",dur:90,price:3},
  {city:"london",cat:"restaurant",name:"Borough Market",desc:"Старейший фуд-маркет Лондона (1756!): устрицы Richard Haward (£2/шт), пирожки Pieminster, горячие сэндвичи Kappacasein, сыры Neal's Yard. Четверг–суббота. Приходите голодными, пробуйте всё",lat:51.5055,lng:-0.0909,wiki:"https://en.wikipedia.org/wiki/Borough_Market",website:"https://boroughmarket.org.uk",dur:90,price:1},
  {city:"london",cat:"restaurant",name:"Bao",desc:"Тайваньские паровые булочки bao — мягкое облако теста с начинкой. Культ Soho: всего 30 мест, очередь 20–40 мин, но оно того стоит. Классика — свиной bao за £5. Без резерваций",lat:51.5134,lng:-0.1316,website:"https://baolondon.com",dur:45,price:1},
  {city:"london",cat:"restaurant",name:"Padella",desc:"Свежая паста ручной работы за £6–12 — нигде в Лондоне нет такого соотношения качества и цены. Borough Market. Очередь с открытия (12:00), приходите к 11:45. Паппарделле с рагу — хит",lat:51.5056,lng:-0.0901,website:"https://www.padella.co",dur:60,price:1},
  {city:"london",cat:"restaurant",name:"Hoppers",desc:"Шри-ланкийская кухня: хопперы (хрустящие чаши из рисовой муки), котту роти (рубленые лепёшки с мясом), кокосовое карри. Soho. Без резерваций, приходите к 17:00 к открытию. Дёшево: £8–15",lat:51.5135,lng:-0.1324,website:"https://www.hopperslondon.com",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"The Wolseley",desc:"Grand café на Piccadilly в здании бывшего автосалона 1920-х. Мрамор, колонны, высокие потолки. Классика для завтрака или afternoon tea в венской атмосфере. Бронировать!",lat:51.5086,lng:-0.1396,wiki:"https://en.wikipedia.org/wiki/The_Wolseley",website:"https://www.thewolseley.com",dur:90,price:3},
  {city:"london",cat:"restaurant",name:"St. John",desc:"Ресторан, начавший революцию nose-to-tail eating: костный мозг с петрушкой (£12) — блюдо, изменившее британскую кухню. Белые стены, никаких украшений, только еда. Farringdon. Бронировать",lat:51.5206,lng:-0.1027,wiki:"https://en.wikipedia.org/wiki/St._John_(restaurant)",website:"https://www.stjohnrestaurant.com",dur:90,price:2},
  {city:"london",cat:"restaurant",name:"Flat Iron",desc:"Один стейк — flat iron — приготовленный идеально, за £12. Бесплатный конус мороженого на десерт. Несколько локаций. Без резерваций, очередь 10–20 мин. Лучший стейк по соотношению цена/качество в Лондоне",lat:51.5142,lng:-0.1273,website:"https://flatironsteak.co.uk",dur:60,price:1},
  {city:"london",cat:"restaurant",name:"Rochelle Canteen",desc:"Скрытый во дворе бывшей школы искусств — звоните в дверной звонок, чтобы войти. Простая сезонная британская еда. Тут обедают шоредичские дизайнеры и архитекторы. Тихо, вкусно, нетуристично",lat:51.5268,lng:-0.0773,website:"https://www.arnoldandhenderson.com/rochelle-canteen",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"E Pellicci",desc:"Итальянское семейное кафе с 1900 года, третье поколение за стойкой. Интерьер арт-деко 1946 года — Grade II listed. Full English Breakfast (£10), чай в кружке. Bethnal Green. Реальный East End",lat:51.5273,lng:-0.0563,wiki:"https://en.wikipedia.org/wiki/E_Pellicci",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"Regency Café",desc:"Британский greasy spoon 1946 года: яйца, бекон, сосиски, бобы, чай в больших кружках. Крики ваших заказов через весь зал. Интерьер не менялся 80 лет. Westminster. Самый аутентичный завтрак Лондона",lat:51.4939,lng:-0.1335,website:"https://www.regencycafe.co.uk",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"Ottolenghi",desc:"Средиземноморская кухня Йотама Оттоленги: салаты как произведения искусства, выпечка с тахини и гранатом. Витрина притягивает. Несколько локаций. Islington — самый первый и атмосферный",lat:51.5373,lng:-0.1425,wiki:"https://en.wikipedia.org/wiki/Yotam_Ottolenghi",website:"https://ottolenghi.co.uk",dur:45,price:2},
  {city:"london",cat:"restaurant",name:"Kiln",desc:"Тайская кухня на открытом огне — вок-станции у вас на глазах. Soho. Сидите у барной стойки и смотрите, как готовят. Острые карри из Исана, дым, шум, вкус. Без резерваций, очередь стоит",lat:51.5136,lng:-0.1318,website:"https://kilnsoho.com",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"The Ivy",desc:"Театральная классика с 1917 года — сюда ходят после спектакля. Витражные окна, дубовые панели. Pre-theatre menu (2 блюда за £25) — выгодно. Covent Garden. Бронировать за неделю+",lat:51.5122,lng:-0.1246,wiki:"https://en.wikipedia.org/wiki/The_Ivy",website:"https://www.the-ivy.co.uk",dur:90,price:2},
  {city:"london",cat:"restaurant",name:"Beigel Bake",desc:"Бейглы 24/7 с 1974 года: горячие, только из печи. Солонина с горчицей (£5) — культовый сэндвич Лондона. Brick Lane. Очередь движется быстро, даже в 3 ночи",lat:51.5199,lng:-0.0710,wiki:"https://en.wikipedia.org/wiki/Beigel_Bake",dur:15,price:1},
  {city:"london",cat:"restaurant",name:"Honey & Co",desc:"Крошечное место (25 мест) с огромной репутацией: ближневосточная кухня супружеской пары из Израиля. Завтрак с шакшукой, ужин с бараниной. Warren Street. Бронировать обязательно!",lat:51.5249,lng:-0.1380,website:"https://honeyandco.co.uk",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"Barrafina",desc:"Испанские тапас у мраморной барной стойки: хамон, тортилья, пульпо, креветки аль ахильо. Открытая кухня. Без резерваций — стойте в очереди или приходите к 17:00. Несколько локаций",lat:51.5104,lng:-0.1241,website:"https://www.barrafina.co.uk",dur:60,price:2},
  {city:"london",cat:"restaurant",name:"Gymkhana",desc:"Индийская кухня на уровне Michelin star: тандурная баранина, бирьяни, дегустационное меню. Колониальный декор с фанатами на потолке. Mayfair. Дорого (£50–80), но незабываемо. Бронировать за 2 недели",lat:51.5095,lng:-0.1433,website:"https://www.gymkhaналondon.com",dur:90,price:3},
  {city:"london",cat:"restaurant",name:"Smoking Goat",desc:"Тайские smoky блюда на углях: рыба в банановом листе, куриные крылья с чили, рис с крабом. Shoreditch. Шумно, тесно, остро, весело. Без резерваций — приходите рано или поздно",lat:51.5247,lng:-0.0811,website:"https://smokinggoatbar.com",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"Gloria",desc:"Итальянский ресторан-вечеринка от Big Mamma Group: диско-шар на потолке, лимончелло-шоты, официанты танцуют. Порции огромные, паста от £12. Shoreditch. Бронировать за неделю, или очередь 30 мин",lat:51.5242,lng:-0.0815,website:"https://www.bigmammagroup.com/en/trattorias/gloria",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"Tayyabs",desc:"Пакистанский ресторан-легенда: баранья ножка, курица тикка, наан из тандура. Порции огромные, цены смешные (£10–15 на человека). Whitechapel. Очередь — часть опыта. BYOB (можно своё вино)",lat:51.5161,lng:-0.0630,website:"https://www.tayyabs.co.uk",dur:60,price:1},
  {city:"london",cat:"restaurant",name:"Poppies Fish & Chips",desc:"Классический fish & chips в ретро-интерьере 1950-х: юкбоксы, хромированные стойки, рок-н-ролл. Spitalfields. Туристично, но рыба свежая, порции большие. Треска в кляре + mushy peas = английская классика",lat:51.5196,lng:-0.0743,website:"https://www.poppiesfishandchips.co.uk",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"M. Manze",desc:"Pie & mash с 1902 года — последний оплот рабочей кухни East End: мясной пирог, пюре, зелёный ликёр (соус из петрушки). Tower Bridge Road. Плиточный интерьер не менялся 120 лет. £6 за полный обед",lat:51.4993,lng:-0.0770,wiki:"https://en.wikipedia.org/wiki/M._Manze",dur:75,price:2},
  {city:"london",cat:"restaurant",name:"Lyle's",desc:"Michelin star, но без пафоса: минималистичный интерьер, сезонное меню из 4–5 блюд, британские ингредиенты. Shoreditch. Обед (£35–45) — лучший вариант, вечером дороже. Тихо, вкусно, современно",lat:51.5227,lng:-0.0775,website:"https://www.lyleslondon.com",dur:90,price:3},
  {city:"london",cat:"restaurant",name:"The River Café",desc:"Легендарный итальянский ресторан Рут Роджерс с 1987 года — здесь начинали Джейми Оливер и многие звёздные шефы. Hammersmith, терраса у Темзы. Дорого (£60–100), бронировать за месяц. Опыт на всю жизнь",lat:51.4879,lng:-0.2262,wiki:"https://en.wikipedia.org/wiki/River_Café_(London)",website:"https://www.rivercafe.co.uk",dur:120,price:3},
  {city:"london",cat:"restaurant",name:"Coal Office",desc:"Ресторан дизайнера Тома Диксона в угольном складе King's Cross: промышленные интерьеры, медные лампы, вся мебель — его дизайн. Ближневосточная кухня. Эффектное место для ужина. Бронировать",lat:51.5355,lng:-0.1241,website:"https://coaloffice.co.uk",dur:90,price:2},
  /* ── LONDON · SHOPPING ── */
  {city:"london",cat:"shopping",name:"Primark (Oxford Street)",desc:"5 этажей бюджетной одежды — от £3 за футболку. Огромный флагман. Всегда многолюдно, но цены не имеют конкуренции. Базовый гардероб, бельё, пижамы, аксессуары. Oxford Circus",lat:51.5156,lng:-0.1419,website:"https://www.primark.com",dur:60,price:1},
  {city:"london",cat:"shopping",name:"TK Maxx",desc:"Дискаунт брендовой одежды: -60% на Michael Kors, Ralph Lauren, Calvin Klein. Требует терпения — надо копаться. Лучшие локации: Kensington High St (крупный) и Covent Garden (центральный)",lat:51.4994,lng:-0.1918,website:"https://www.tkmaxx.com",dur:45,price:1},
  {city:"london",cat:"shopping",name:"Beyond Retro",desc:"Тонны винтажной одежды по £10–30: джинсовки, гавайки, 90-е, рабочая одежда. Самый большой — на Cheshire Street (Shoreditch). Перебирайте стойки — жемчужины прячутся. Рядом с Brick Lane",lat:51.5216,lng:-0.0698,website:"https://www.beyondretro.com",dur:45,price:1},
  {city:"london",cat:"shopping",name:"COS",desc:"Минималистичная одежда (старшая сестра H&M): чистые линии, натуральные ткани, скандинавский дизайн. Качество выше H&M, цены адекватные (£30–100). Regent Street — большой магазин",lat:51.5136,lng:-0.1394,website:"https://www.cosstores.com",dur:45,price:1},
  {city:"london",cat:"shopping",name:"& Other Stories",desc:"Скандинавский дизайн по доступным ценам: одежда, обувь, сумки, своя косметика. Более женственный и игривый, чем COS. Regent Street. Хорошие подарки (косметика от £10)",lat:51.5125,lng:-0.1386,website:"https://www.stories.com",dur:45,price:1},
  {city:"london",cat:"shopping",name:"Uniqlo",desc:"Японский бренд: идеальные базовые вещи. Кашемир за £80, пуховик за £60, HEATTECH-термобельё. Oxford Street — огромный флагман 4 этажа. Качество/цена — лучшее соотношение",lat:51.5154,lng:-0.1410,website:"https://www.uniqlo.com/uk",dur:45,price:1},
  {city:"london",cat:"shopping",name:"Oxfam Boutique",desc:"Charity shop с отобранным винтажом и дизайнерскими вещами: Burberry, M&S, Reiss за £5–20. Доходы — на благотворительность. Marylebone и Notting Hill — лучшие локации. Охота за сокровищами",lat:51.5209,lng:-0.1550,website:"https://www.oxfam.org.uk/shop",dur:45,price:1},
  {city:"london",cat:"shopping",name:"Monki",desc:"Шведский бренд (сестра Weekday): яркая одежда для молодых, £10–50. Весёлые принты, база, аксессуары. Carnaby Street. Если хочется чего-то цветного и недорогого",lat:51.5135,lng:-0.1369,website:"https://www.monki.com",dur:45,price:1},
  /* ── LONDON · ATTRACTIONS ── */
  {city:"london",cat:"attraction",name:"Sky Garden",desc:"Бесплатная обзорная площадка на 35 этаже (155 м): тропический сад в небе, вид на Tower Bridge и весь City. Бронировать за 3 дня на сайте (слоты уходят быстро!). Бар и ресторан — можно без брони, но с очередью",lat:51.5111,lng:-0.0834,wiki:"https://en.wikipedia.org/wiki/20_Fenchurch_Street",website:"https://skygarden.london",dur:45,price:0},
  {city:"london",cat:"attraction",name:"Churchill War Rooms",desc:"Секретный бункер, из которого Черчилль руководил войной 1940–45. Всё подлинное: карты с булавками, телефоны, походная кровать. Музей Черчилля — интерактивный и современный. Мощное впечатление. £28",lat:51.5022,lng:-0.1297,wiki:"https://en.wikipedia.org/wiki/Churchill_War_Rooms",website:"https://www.iwm.org.uk/visits/churchill-war-rooms",dur:90,price:2},
  {city:"london",cat:"attraction",name:"Leadenhall Market",desc:"Викторианский крытый рынок 1881 года: кобальтово-бордовые чугунные колонны, стеклянная крыша. Снимался как Diagon Alley в Гарри Поттере. Сейчас — рестораны и бары для банкиров City. Красиво в любую погоду",lat:51.5133,lng:-0.0832,wiki:"https://en.wikipedia.org/wiki/Leadenhall_Market",website:"https://www.leadenhallmarket.co.uk",dur:60,price:1},
  {city:"london",cat:"attraction",name:"Columbia Road Flower Market",desc:"Воскресенье 8:00–15:00: улица превращается в реку цветов — букеты от £5, экзотические растения, кактусы. Вокруг — керамические мастерские, винтажные магазины, кофейни. Shoreditch. Приходите рано",lat:51.5311,lng:-0.0678,wiki:"https://en.wikipedia.org/wiki/Columbia_Road_Flower_Market",dur:90,price:0},
  {city:"london",cat:"attraction",name:"God's Own Junkyard",desc:"Склад неоновых вывесок: тысячи штук от ретро-рекламы до кинореквизита, розовые фламинго, религиозные символы. Walthamstow. Только выходные (пт вечер, сб-вс). Бесплатно. Лучшее место для фото в Лондоне",lat:51.5868,lng:-0.0217,website:"https://www.godsownjunkyard.co.uk",dur:60,price:1},
  {city:"london",cat:"attraction",name:"Little Venice",desc:"Каналы с яркими плавучими домами, café-лодки, утки. Начните здесь и прогуляйтесь по Regent's Canal до Camden (45 мин) — через парк, зоопарк, под мостами. Тихий, нетуристический маршрут",lat:51.5223,lng:-0.1819,wiki:"https://en.wikipedia.org/wiki/Little_Venice,_London",dur:60,price:1},
  {city:"london",cat:"attraction",name:"Primrose Hill",desc:"Холм 78 м с лучшим бесплатным видом на Лондон: от Shard до London Eye, весь скайлайн. Закаты — особенно. Рядом с Camden и Regent's Park, совмещайте. Берите вино и плед",lat:51.5417,lng:-0.1645,wiki:"https://en.wikipedia.org/wiki/Primrose_Hill",dur:60,price:1},
  {city:"london",cat:"attraction",name:"Covent Garden",desc:"Площадь с уличными артистами (оперные певцы, акробаты, фокусники), рынок Apple Market по выходным, Royal Opera House, магазины. Центральная атмосфера Лондона. Вечером — подсветка и ресторан-террасы",lat:51.5118,lng:-0.1227,wiki:"https://en.wikipedia.org/wiki/Covent_Garden",website:"https://www.coventgarden.london",dur:60,price:1},
  {city:"london",cat:"attraction",name:"Chinatown",desc:"Два квартала красных фонарей и пагод: лучший димсам в Лондоне (Dumplings' Legend), пекинская утка (Four Seasons), bubble tea. Gerrard Street. После театра в Вест-Энде — идеальный поздний ужин",lat:51.5113,lng:-0.1313,wiki:"https://en.wikipedia.org/wiki/Chinatown,_London",dur:60,price:1},
  {city:"london",cat:"attraction",name:"Neal's Yard",desc:"Скрытый цветной дворик в Covent Garden: дома покрашены в синий, жёлтый, зелёный. Сырная лавка Neal's Yard Dairy (попробуйте Stichelton), кафе, wholefood-магазин. Фотогенично, уютно",lat:51.5145,lng:-0.1265,wiki:"https://en.wikipedia.org/wiki/Neal%27s_Yard",dur:60,price:1},
  {city:"edinburgh",cat:"festival",name:"Edinburgh Fringe (превью)",desc:"Крупнейший фестиваль искусств в мире (3000+ шоу!). Начинается 7 августа, но превью и warm-up шоу появляются уже в конце июля. Комедия, театр, танцы на каждом углу. Бесплатные шоу — тоже отличные",lat:55.9497,lng:-3.1883,wiki:"https://en.wikipedia.org/wiki/Edinburgh_Festival_Fringe",website:"https://www.edfringe.com",dur:240,price:1},
  {city:"edinburgh",cat:"music",name:"Edinburgh Jazz & Blues Festival",desc:"17–26 июля — прямо в ваши даты! Джаз, блюз, соул, фанк на 30+ площадках города: от старинных церквей до подвальных клубов. Уличные концерты бесплатно. Билеты на клубы £10–25",lat:55.9510,lng:-3.1910,wiki:"https://en.wikipedia.org/wiki/Edinburgh_Jazz_and_Blues_Festival",website:"https://edinburghjazzfestival.com",dur:150,price:2},
  {city:"edinburgh",cat:"music",name:"Sneaky Pete's",desc:"Маленький подвальный клуб (100 чел.) — электроника, инди, техно. Считается лучшим клубом Эдинбурга. Cowgate. Билеты £5–15. Потный, громкий, настоящий",lat:55.9472,lng:-3.1887,website:"https://www.sneakypetes.co.uk",dur:150,price:2},
  {city:"edinburgh",cat:"music",name:"The Bongo Club",desc:"Эклектичная программа: от кабаре до drum'n'bass. В бывшем университетском зале на Holyrood Road. Ночные вечеринки, живая музыка, комедия. Всегда что-то интересное",lat:55.9503,lng:-3.1825,website:"https://thebongoclub.co.uk",dur:150,price:2},
  {city:"edinburgh",cat:"music",name:"Cabaret Voltaire",desc:"Подземный клуб в историческом подвале XVIII века — каменные стены, низкие потолки. Электроника, техно, инди. Cowgate. Работает до 3:00. Вход £5–10",lat:55.9490,lng:-3.1884,website:"https://www.thecabaretvoltaire.com",dur:150,price:2},
  {city:"edinburgh",cat:"music",name:"Sandy Bell's",desc:"Живая шотландская фолк-музыка каждый вечер с 1942 года: скрипки, волынки, бодраны. Маленький паб, аутентичная атмосфера, местные танцуют. Бесплатно! Пинта виски и послушать. Forrest Road",lat:55.9452,lng:-3.1915,wiki:"https://en.wikipedia.org/wiki/Sandy_Bell%27s",dur:150,price:2},
  {city:"edinburgh",cat:"museum",name:"National Museum of Scotland",desc:"От геологии до космоса, от кельтских украшений до овечки Долли. Крыша с видом на замок — бесплатно. Зал Grand Gallery — потрясающее пространство. 4–5 часов можно провести легко. Бесплатно",lat:55.9467,lng:-3.1924,wiki:"https://en.wikipedia.org/wiki/National_Museum_of_Scotland",website:"https://www.nms.ac.uk",dur:180,price:0},
  {city:"edinburgh",cat:"museum",name:"Scottish National Gallery",desc:"Рафаэль, Тициан, Пуссен, Вермеер + шотландские мастера (Рэбёрн, Аллан). Бесплатно. На холме между Old Town и New Town — заходите по дороге. Компактная, но сильная коллекция",lat:55.9508,lng:-3.1960,wiki:"https://en.wikipedia.org/wiki/Scottish_National_Gallery",website:"https://www.nationalgalleries.org",dur:120,price:0},
  {city:"edinburgh",cat:"museum",name:"Scottish Nat. Gallery of Modern Art",desc:"Сюрреализм, поп-арт, современные инсталляции. Два здания в парке",lat:55.9494,lng:-3.2227,wiki:"https://en.wikipedia.org/wiki/Scottish_National_Gallery_of_Modern_Art",website:"https://www.nationalgalleries.org/visit/scottish-national-gallery-modern-art",dur:120,price:0},
  {city:"edinburgh",cat:"museum",name:"Surgeons' Hall Museums",desc:"Музей хирургии и анатомии: скелеты, хирургические инструменты XVI века, восковые модели болезней. Жуткий и завораживающий одновременно. Для тех, кого интересует тёмная сторона медицины. £8",lat:55.9438,lng:-3.1832,wiki:"https://en.wikipedia.org/wiki/Surgeons%27_Hall",website:"https://museum.rcsed.ac.uk",dur:60,price:1},
  {city:"edinburgh",cat:"museum",name:"Writers' Museum",desc:"Бёрнс, Скотт, Стивенсон — рукописи, личные вещи, первые издания. В доме XVII века Lady Stair's Close. Бесплатно. Маленький, но для литературных фанатов — must",lat:55.9499,lng:-3.1931,wiki:"https://en.wikipedia.org/wiki/Writers%27_Museum",website:"https://www.edinburghmuseums.org.uk",dur:120,price:0},
  {city:"edinburgh",cat:"museum",name:"Summerhall",desc:"Бывший ветеринарный колледж → культурный центр: галерея, театр, пивоварня Barney's Beer. Экспериментальное искусство, перформанс. Бар с пивом, сваренным на месте. Август — главная площадка Fringe",lat:55.9405,lng:-3.1811,website:"https://www.summerhall.co.uk",dur:120,price:0},
  {city:"edinburgh",cat:"art",name:"City Art Centre",desc:"Jean F. Watson: An Artistic Legacy — шотландская живопись XX века. 6 этажей городской коллекции. Бесплатно. Royal Mile, рядом с Waverley. Быстрый визит на 30–60 мин. До 4 октября",lat:55.9518,lng:-3.1873,wiki:"https://en.wikipedia.org/wiki/City_Art_Centre",website:"https://www.edinburghmuseums.org.uk/venue/city-art-centre",dur:60,price:0},
  {city:"edinburgh",cat:"art",name:"Jupiter Artland",desc:"Парк скульптур на 40 га: Антони Гормли, Корнелия Паркер, Аниш Капур, Шарль Жансон. 30 мин от центра. Прогулка по лесу между инсталляциями. Июнь–сентябрь. £11.50. Полдня. Возьмите удобную обувь",lat:55.9017,lng:-3.3775,wiki:"https://en.wikipedia.org/wiki/Jupiter_Artland",website:"https://www.jupiterartland.org",dur:180,price:1},
  {city:"edinburgh",cat:"art",name:"Fruitmarket Gallery",desc:"Современное искусство в бывшем фруктовом рынке — новое крыло из грубого бетона (2021). Всегда качественные выставки, хороший книжный. Рядом с Waverley Station. Бесплатно. 30–60 мин",lat:55.9519,lng:-3.1856,wiki:"https://en.wikipedia.org/wiki/Fruitmarket_Gallery",website:"https://www.fruitmarket.co.uk",dur:60,price:0},
  {city:"edinburgh",cat:"art",name:"Collective (Calton Hill)",desc:"Галерея в бывшей обсерватории на вершине Calton Hill: современное искусство + лучший вид на Эдинбург в комплекте. Бесплатно. Совмещайте с прогулкой по холму на закате",lat:55.9552,lng:-3.1769,website:"https://www.collectivegallery.net",dur:60,price:0},
  {city:"edinburgh",cat:"arch",name:"Edinburgh Castle",desc:"Крепость на вулканической скале — архитектурные слои от XII до XIX века: Часовня Св. Маргариты (1130!), Большой зал, Национальный военный мемориал. Камень Судьбы, пушка «Монс Мег». Вид на весь город. £19.50",lat:55.9486,lng:-3.1999,wiki:"https://en.wikipedia.org/wiki/Edinburgh_Castle",website:"https://www.edinburghcastle.scot",dur:120,price:2},
  {city:"edinburgh",cat:"arch",name:"St Giles' Cathedral",desc:"Готический собор XV века с «короной» на шпиле — символ Эдинбурга. Витражи, Thistle Chapel (крошечная капелла с невероятной резьбой). Royal Mile. Бесплатно (пожертвование £5 приветствуется)",lat:55.9490,lng:-3.1920,wiki:"https://en.wikipedia.org/wiki/St_Giles%27_Cathedral",website:"https://www.stgilescathedral.org.uk",dur:30,price:1},
  {city:"edinburgh",cat:"arch",name:"Scottish Parliament",desc:"Деконструктивизм Энрика Мираллеса (2004): здание вдохновлено перевёрнутыми лодками, листьями и шотландскими скалами. Бесплатные экскурсии (бронировать на сайте). Рядом с Holyrood Palace",lat:55.9524,lng:-3.1754,wiki:"https://en.wikipedia.org/wiki/Scottish_Parliament_Building",website:"https://www.parliament.scot",dur:30,price:1},
  {city:"edinburgh",cat:"arch",name:"Rosslyn Chapel",desc:"Позднеготическая резьба XV века невероятной плотности: 100+ каменных лиц, зелёные люди, танцующие скелеты. 20 мин от центра. Из «Кода Да Винчи», но реальная история интереснее. Аудиогид включён, £9.50",lat:55.8554,lng:-3.1602,wiki:"https://en.wikipedia.org/wiki/Rosslyn_Chapel",website:"https://www.rosslynchapel.com",dur:60,price:1},
  {city:"edinburgh",cat:"design_shop",name:"Edinburgh Printmakers",desc:"Крупнейшая открытая мастерская печатной графики в Европе: литография, офорт, шелкография. Castle Mills, Fountainbridge. Можно посмотреть, как работают художники. Магазин принтов — отличные подарки",lat:55.9425,lng:-3.2100,website:"https://edinburgh-printmakers.co.uk",dur:30,price:0},
  {city:"edinburgh",cat:"design_shop",name:"Dovecot Studios",desc:"Ткацкая мастерская гобеленов в викторианских банях с 1912 года. Огромные станки, художники за работой. Выставки текстильного искусства. Для любителей ремёсел — уникальное место. Бесплатная галерея",lat:55.9455,lng:-3.1883,wiki:"https://en.wikipedia.org/wiki/Dovecot_Studios",website:"https://dovecotstudios.com",dur:30,price:0},
  {city:"edinburgh",cat:"design_shop",name:"Scottish Design Exchange",desc:"Маркетплейс 150+ шотландских дизайнеров: ювелирка, керамика, текстиль с тартаном, иллюстрации. Ocean Terminal, Leith. Лучшее место для аутентичных шотландских подарков (не китайских сувениров)",lat:55.9750,lng:-3.1766,website:"https://www.scottishdesignexchange.com",dur:30,price:0},
  {city:"edinburgh",cat:"market",name:"Grassmarket",desc:"Площадь под замком: винтажные магазины (Armstrong's Vintage — с 1840!), пабы (The Last Drop — назван в честь виселицы), кафе. По выходным — фермерский рынок. Живописно и исторически жутко",lat:55.9472,lng:-3.1952,wiki:"https://en.wikipedia.org/wiki/Grassmarket",dur:90,price:0},
  {city:"edinburgh",cat:"market",name:"Stockbridge Market",desc:"Воскресный фермерский + крафт-рынок: сыры, выпечка, шотландский лосось, handmade украшения. Маленький и ламповый. Потом — прогулка по Inverleith Row к Ботаническому саду",lat:55.9568,lng:-3.2073,website:"https://www.stockbridgemarket.com",dur:90,price:0},
  {city:"edinburgh",cat:"market",name:"Backbeat Records",desc:"Виниловый рай: рок, джаз, соул, электроника, шотландский инди. E Crosscauseway. Для коллекционеров пластинок — обязательный визит. Хозяин знает всё о музыке",lat:55.9429,lng:-3.1828,dur:90,price:0},
  {city:"edinburgh",cat:"nature",name:"Arthur's Seat",desc:"Древний вулкан 251 м в центре города. 45 мин подъём — нетрудный. Панорама 360°: замок, море, холмы. Лучше утром или на закате. Бесплатно. Начинайте от Holyrood Palace. Ветер — берите куртку",lat:55.9445,lng:-3.1615,wiki:"https://en.wikipedia.org/wiki/Arthur%27s_Seat",dur:90,price:0},
  {city:"edinburgh",cat:"nature",name:"Calton Hill",desc:"Недостроенный «Парфенон», обсерватория, мемориал Нельсона. Лучшее место для заката в Эдинбурге — 5 минут подъёма, панорама города и моря. Бесплатно. Прямо рядом с центром",lat:55.9552,lng:-3.1769,wiki:"https://en.wikipedia.org/wiki/Calton_Hill",dur:30,price:0},
  {city:"edinburgh",cat:"nature",name:"Portobello Beach",desc:"Песчаный пляж с викторианскими домами: прогулка по набережной, рыба и чипсы, мороженое. 20 мин автобусом из центра. В хорошую погоду — как на морском курорте. Утренний заплыв для смелых (вода +14°C)",lat:55.9500,lng:-3.1127,wiki:"https://en.wikipedia.org/wiki/Portobello,_Edinburgh",dur:120,price:0},
  {city:"edinburgh",cat:"nature",name:"Pentland Hills",desc:"Дикие холмы с овцами — 30 мин от центра. Маршруты от 2 до 6 часов. Виды на Эдинбург, море и горы одновременно. Bonaly Country Park — удобный вход. Берите ветровку и воду",lat:55.8600,lng:-3.2350,wiki:"https://en.wikipedia.org/wiki/Pentland_Hills",dur:240,price:0},
  {city:"edinburgh",cat:"district",name:"Old Town",desc:"Средневековые переулки (closes) — узкие проходы между домами, скрытые дворы, лестницы. Попросите карту «closes and courtyards» в турофисе. Royal Mile — от замка до Holyrood Palace. Вечерняя прогулка — мрачно и красиво",lat:55.9497,lng:-3.1894,wiki:"https://en.wikipedia.org/wiki/Old_Town,_Edinburgh",dur:120,price:0},
  {city:"edinburgh",cat:"district",name:"New Town",desc:"Георгианская архитектура XVIII века: регулярная сетка улиц, элегантные фасады, Moray Place, Charlotte Square. UNESCO. Более спокойная, чем Old Town. Прогулка по Queen Street Gardens",lat:55.9553,lng:-3.2002,wiki:"https://en.wikipedia.org/wiki/New_Town,_Edinburgh",dur:120,price:0},
  {city:"edinburgh",cat:"district",name:"Stockbridge",desc:"Деревенская атмосфера в городе: ботанический сад, воскресный рынок, антикварные магазины, независимые кафе. Река Water of Leith. Гуляйте до Dean Village по набережной. Нетуристичный",lat:55.9573,lng:-3.2138,wiki:"https://en.wikipedia.org/wiki/Stockbridge,_Edinburgh",dur:120,price:0},
  {city:"edinburgh",cat:"district",name:"Dean Village",desc:"Средневековая деревня у реки Water of Leith — прямо в центре города, но ощущение что вы за городом. Каменные мосты, мельницы, тишина. Самое фотогеничное место Эдинбурга. 10 мин пешком от Princes St",lat:55.9517,lng:-3.2158,wiki:"https://en.wikipedia.org/wiki/Dean_Village",dur:120,price:0},
  {city:"edinburgh",cat:"district",name:"Leith",desc:"Портовый квартал: бывшие склады → рестораны, крафтовые пивоварни, галереи. Royal Yacht Britannia здесь. Shore — набережная с ресторанами. Менее туристичный, чем Old Town, более живой. Автобус 22 из центра",lat:55.9752,lng:-3.1721,wiki:"https://en.wikipedia.org/wiki/Leith",dur:120,price:0},
  {city:"edinburgh",cat:"district",name:"Victoria Street & Grassmarket",desc:"Изогнутая цветная улица — одна из самых фотографируемых в Шотландии. Независимые магазины: Armstrong's Vintage, Aha Ha Ha (гэги), букинисты. Вниз — к Grassmarket и пабам",lat:55.9467,lng:-3.1955,wiki:"https://en.wikipedia.org/wiki/Victoria_Street,_Edinburgh",dur:120,price:0},
  /* ── EDINBURGH · RESTAURANTS ── */
  {city:"edinburgh",cat:"restaurant",name:"The Witchery",desc:"Романтический ресторан у самых ворот замка: готические интерьеры, свечи, гобелены, красный бархат. Шотландская кухня: оленина, лобстер, хаггис с виски. Дорого (£50–80), но это опыт. Бронировать обязательно",lat:55.9493,lng:-3.1951,wiki:"https://en.wikipedia.org/wiki/The_Witchery_by_the_Castle",website:"https://www.thewitchery.com",dur:90,price:3},
  {city:"edinburgh",cat:"restaurant",name:"Timberyard",desc:"Сезонная кухня в бывшей деревообрабатывающей мастерской: локальные продукты, своя ферма. Michelin Bib Gourmand. Дегустационное меню (£55) или à la carte. Резервировать за неделю",lat:55.9458,lng:-3.2021,website:"https://www.timberyard.co",dur:90,price:2},
  {city:"edinburgh",cat:"restaurant",name:"The Gardener's Cottage",desc:"Farm-to-table в старом садовом домике XIX века: общие столы, сезонное дегустационное меню (£45–55). У подножия Calton Hill. Интимно, красиво. Один из лучших ресторанов Шотландии. Бронировать!",lat:55.9563,lng:-3.1828,website:"https://thegardenerscottage.co",dur:90,price:2},
  {city:"edinburgh",cat:"restaurant",name:"Oink",desc:"Целый поросёнок жарится прямо в витрине — от него отрезают мясо для вашего сэндвича. £5–7 за огромный pulled pork roll с яблочным соусом. Victoria Street. Быстро, вкусно, дёшево. Лучший фаст-фуд Эдинбурга",lat:55.9473,lng:-3.1936,website:"https://www.oinkhogroast.co.uk",dur:15,price:1},
  {city:"edinburgh",cat:"restaurant",name:"Mary's Milk Bar",desc:"Лучшее мороженое в Шотландии: авторские вкусы (морская соль с карамелью, lavender, whisky marmalade), всё сами, из локальных продуктов. Grassmarket. Порция от £3. Берите два шарика",lat:55.9471,lng:-3.1948,website:"https://www.marysmilkbar.com",dur:15,price:1},
  {city:"edinburgh",cat:"restaurant",name:"The Dogs",desc:"Где обедают местные: честное меню из сезонных продуктов по £8–15. New Town, George Street. Без понтов, расслабленная атмосфера. Бокал шотландского пива и пирог с олениной — идеально",lat:55.9537,lng:-3.1954,website:"https://www.thedogsonline.co.uk",dur:75,price:2},
  {city:"edinburgh",cat:"restaurant",name:"Dishoom Edinburgh",desc:"Та же концепция бомбейского кафе, что в Лондоне. St Andrew Square. Завтрак (bacon naan roll!) до 11:45 — лучший в городе. Обед и ужин тоже отличные. Очередь — приходите к открытию",lat:55.9549,lng:-3.1927,website:"https://www.dishoom.com/edinburgh",dur:75,price:2},
  {city:"edinburgh",cat:"restaurant",name:"The Scran & Scallie",desc:"Гастропаб от шефа Tom Kitchin (Michelin star): шотландские продукты, craft beer, воскресный roast. Stockbridge, деревенская атмосфера. Дешевле, чем его ресторан The Kitchin, но тоже вкусно",lat:55.9593,lng:-3.2097,website:"https://scranandscallie.com",dur:75,price:2},
  {city:"edinburgh",cat:"restaurant",name:"Mums Great Comfort Food",desc:"Домашняя шотландская кухня: пироги, macaroni cheese, bangers & mash. Как будто мама готовила (если бы мама была шотландкой). Forrest Road. £8–12. Уютно, сытно",lat:55.9465,lng:-3.1894,website:"https://www.monstermashcafe.co.uk",dur:75,price:2},
  {city:"edinburgh",cat:"restaurant",name:"Makars Gourmet Mash Bar",desc:"Haggis, neeps & tatties в 10 вариациях: с виски-соусом, в темпуре, с чеддером. Шотландская классика — но творчески. Mound Place, рядом с замком. £10–15. Если попробовать хаггис — то здесь",lat:55.9503,lng:-3.1939,website:"https://www.makarsmashbar.com",dur:75,price:2},
  {city:"edinburgh",cat:"restaurant",name:"The Mosque Kitchen",desc:"Карри при мечети на Nicolson Square: огромные порции за £5–7. Только обед (12:00–14:00). Пакистанская и индийская еда, аутентично, дёшево, вкусно. Студенты и таксисты — знак качества",lat:55.9462,lng:-3.1864,dur:75,price:2},
  {city:"edinburgh",cat:"restaurant",name:"Mamma's Pizza",desc:"Неаполитанская пицца за £7–9 в историческом подвале Grassmarket. Тесто на закваске, простые ингредиенты. Дёшево, вкусно, быстро. Хороший вариант между прогулками по Old Town",lat:55.9470,lng:-3.1945,website:"https://www.mammaspizzaedinburgh.co.uk",dur:75,price:2},
  {city:"edinburgh",cat:"restaurant",name:"Harajuku Kitchen",desc:"Японская домашняя кухня: рамен, гёза, карри. Крошечное место на 20 человек, часто очередь. Bruntsfield. Без резерваций — приходите к 18:00. Порции щедрые, цены честные (£10–15)",lat:55.9413,lng:-3.2048,website:"https://harajukukitchen.co.uk",dur:75,price:2},
  {city:"edinburgh",cat:"restaurant",name:"Ting Thai Caravan",desc:"Тайская уличная еда: пад-тай, зелёное карри, том ям — всё по £8–10. Teviot Place. Маленькое, простое, студенческое. Лучший тайский в городе за эти деньги",lat:55.9456,lng:-3.1899,website:"https://www.tingthai.com",dur:75,price:2},
  {city:"edinburgh",cat:"restaurant",name:"The Piemaker",desc:"Шотландские пироги: steak & ale, haggis & black pudding, chicken & mushroom. £4–6 с пюре и подливой. South Bridge. Отличный горячий перекус между достопримечательностями. Быстро и сытно",lat:55.9487,lng:-3.1872,website:"https://www.thepiemakeredinburgh.co.uk",dur:15,price:1},
  /* ── EDINBURGH · ART ── */
  {city:"edinburgh",cat:"art",name:"Talbot Rice Gallery",desc:"Галерея университета Эдинбурга: Georgian Gallery (старые мастера в классических залах) + White Gallery (радикальное современное). Контраст впечатляет. Old Town. Бесплатно",lat:55.9476,lng:-3.1886,wiki:"https://en.wikipedia.org/wiki/Talbot_Rice_Gallery",website:"https://www.trg.ed.ac.uk",dur:60,price:0},
  /* ── EDINBURGH · NATURE ── */
  {city:"edinburgh",cat:"nature",name:"Royal Botanic Garden Edinburgh",desc:"70 акров садов: пальмовая оранжерея (тропики среди шотландского холода), рододендроны, китайский склон, рок-гарден. Inverleith. Бесплатно (оранжереи £7.50). Совмещайте с прогулкой по Stockbridge",lat:55.9656,lng:-3.2091,wiki:"https://en.wikipedia.org/wiki/Royal_Botanic_Garden_Edinburgh",website:"https://www.rbge.org.uk",dur:120,price:0},
  {city:"edinburgh",cat:"nature",name:"Blackford Hill",desc:"Холм на юге города: обсерватория, панорамные виды на замок и Arthur's Seat. 20 мин подъём. Менее туристично, чем Calton Hill — здесь гуляют местные с собаками. Бесплатно",lat:55.9234,lng:-3.1862,wiki:"https://en.wikipedia.org/wiki/Blackford_Hill",dur:120,price:0},
  {city:"edinburgh",cat:"nature",name:"Hermitage of Braid",desc:"Лесистая долина с ручьём прямо в черте города: старые дубы, мостики, тропинки. Тихое место для прогулки 1–2 часа. Вход со стороны Braid Hills. Бесплатно. Ощущение, что вы за городом",lat:55.9234,lng:-3.2014,wiki:"https://en.wikipedia.org/wiki/Hermitage_of_Braid",dur:120,price:0},
  {city:"edinburgh",cat:"nature",name:"Corstorphine Hill",desc:"Лесной холм с башней Clermiston Tower (залезть можно по выходным). Виды, белки, тихие тропинки. Западная окраина — 15 мин автобусом. Менее известный, чем Arthur's Seat, зато безлюдный",lat:55.9530,lng:-3.2770,wiki:"https://en.wikipedia.org/wiki/Corstorphine_Hill",dur:120,price:0},
  /* ── EDINBURGH · MUSIC ── */
  {city:"edinburgh",cat:"music",name:"The Jazz Bar",desc:"Джаз в подвале на Chambers Street: три сета в вечер, от традиционного до авангарда. С 17:00, вход £5–12. 150 мест, интимно, отличный звук. Культовое место — бронировать на выходные",lat:55.9473,lng:-3.1885,website:"https://www.thejazzbar.co.uk",dur:150,price:2},
  {city:"edinburgh",cat:"music",name:"Henry's Cellar Bar",desc:"Подвальный клуб живой музыки: джаз, инди, альтернатива. Morrison Street. Маленькая сцена, дешёвое пиво, дружелюбная атмосфера. Здесь начинали многие шотландские группы. Вход £3–8",lat:55.9460,lng:-3.2156,website:"https://www.henryscellarbar.com",dur:150,price:2},
  /* ── EDINBURGH · SHOPPING ── */
  {city:"edinburgh",cat:"shopping",name:"TK Maxx (Princes Street)",desc:"Дискаунт брендовой одежды — тот же формат, что в Лондоне. В самом центре на главной улице. Если повезёт — Barbour, Hunter, Pringle of Scotland со скидкой",lat:55.9520,lng:-3.1964,website:"https://www.tkmaxx.com",dur:45,price:1},
  {city:"edinburgh",cat:"shopping",name:"Primark (Princes Street)",desc:"3 этажа бюджетной одежды в центре Эдинбурга. Тот же формат, что в Лондоне. Удобно для базовых покупок между прогулками по Old Town",lat:55.9524,lng:-3.1981,website:"https://www.primark.com",dur:45,price:1},
  {city:"edinburgh",cat:"shopping",name:"Godiva Boutique",desc:"Отобранный винтаж 1920–1980-х: платья, пальто, украшения. West Port, рядом с Grassmarket. Хозяйка отбирает каждую вещь. Качественнее и интереснее массовых винтажных магазинов",lat:55.9472,lng:-3.1973,website:"https://www.godivaboutique.co.uk",dur:45,price:1},
  /* ── EDINBURGH · ATTRACTIONS ── */
  {city:"edinburgh",cat:"attraction",name:"Holyrood Palace",desc:"Официальная резиденция монархов в Шотландии с XVI века. Покои Марии Стюарт (здесь убили её секретаря!), тронный зал, руины аббатства XII века в саду. Аудиогид включён. £18.50",lat:55.9527,lng:-3.1718,wiki:"https://en.wikipedia.org/wiki/Holyrood_Palace",website:"https://www.rct.uk/visit/palace-of-holyroodhouse",dur:90,price:2},
  {city:"edinburgh",cat:"attraction",name:"Royal Yacht Britannia",desc:"Королевская яхта Елизаветы II (1954–1997): 5 палуб, покои королевы, кают-компания, машинное отделение. Ocean Terminal, Leith. Аудиогид + чай в Royal Deck Tea Room. £19. 90 мин",lat:55.9817,lng:-3.1729,wiki:"https://en.wikipedia.org/wiki/HMY_Britannia",website:"https://www.royalyachtbritannia.co.uk",dur:90,price:2},
  {city:"edinburgh",cat:"attraction",name:"Camera Obscura",desc:"Оптические иллюзии на 5 этажах + камера-обскура 1850-х на крыше (проецирует живой вид города на стол). Весело для всех возрастов. Royal Mile, у замка. £20. Смотровая площадка — отличные фото",lat:55.9489,lng:-3.1951,wiki:"https://en.wikipedia.org/wiki/Camera_Obscura_and_World_of_Illusions",website:"https://www.camera-obscura.co.uk",dur:90,price:2},
  {city:"edinburgh",cat:"attraction",name:"Real Mary King's Close",desc:"Подземные улицы XVII века под Royal Mile — замурованные чумой. Экскурсии в костюмах: про жизнь, смерть и призраков в Old Town. 60 мин. £19. Бронировать онлайн. Не для клаустрофобов",lat:55.9502,lng:-3.1901,wiki:"https://en.wikipedia.org/wiki/Mary_King%27s_Close",website:"https://www.realmarykingsclose.com",dur:60,price:2},
  {city:"edinburgh",cat:"daytrip",name:"Stirling",desc:"50 мин поездом. Стерлингский замок (не уступает Эдинбургскому, но без толп), мемориал Уоллеса (270 ступеней, вид на горы), поле битвы при Бэннокберне (1314). Компактный центр, можно за полдня",lat:56.1165,lng:-3.9369,wiki:"https://en.wikipedia.org/wiki/Stirling",website:"https://www.stirlingcastle.scot",dur:480,price:2},
  {city:"edinburgh",cat:"daytrip",name:"St Andrews",desc:"1ч 30 мин. Родина гольфа (Old Course — можно просто погулять), руины собора XII века с видом на море, университет (3-й старейший в UK), пляж West Sands из «Огненных колесниц»",lat:56.3398,lng:-2.7966,wiki:"https://en.wikipedia.org/wiki/St_Andrews",website:"https://www.visitscotland.com/destinations-maps/st-andrews",dur:480,price:2},
  {city:"edinburgh",cat:"daytrip",name:"Glasgow",desc:"50 мин поездом. Kelvingrove Museum (Дали, бесплатно!), здания Макинтоша, Barras Market (блошиный), стрит-арт, лучшая еда в Шотландии. Энергия города совсем другая — промышленная, живая",lat:55.8642,lng:-4.2518,wiki:"https://en.wikipedia.org/wiki/Glasgow",website:"https://peoplemakeglasgow.com",dur:480,price:2},
  {city:"edinburgh",cat:"daytrip",name:"North Berwick",desc:"30 мин поездом. Курортный городок: Bass Rock (150 000 олушей — крупнейшая колония в мире, круизы £42), пляжи, Seabird Centre. Рыба и чипсы у моря. Идеальный однодневный побег",lat:56.0579,lng:-2.7234,wiki:"https://en.wikipedia.org/wiki/North_Berwick",dur:480,price:2},
  {city:"edinburgh",cat:"daytrip",name:"Loch Ness & Highlands",desc:"Целый день. Озеро Лох-Несс (круиз с поиском чудовища — £15), замок Urquhart, перевал Glencoe (горы из Гарри Поттера). Лучше с организованным туром — Rabbie's или Haggis Adventures, £45–60",lat:57.3229,lng:-4.4244,wiki:"https://en.wikipedia.org/wiki/Loch_Ness",website:"https://www.visitscotland.com/see-do/attractions/loch-ness",dur:600,price:2},
  {city:"glasgow",cat:"arch",name:"Glasgow School of Art",desc:"Главное здание шотландского модерна — шедевр Чарльза Ренни Макинтоша (1899–1909). После двух пожаров (2014, 2018) идёт долгая реставрация. Снаружи — потрясающий фасад. Экскурсии по окрестным зданиям Макинтоша доступны",lat:55.8651,lng:-4.2698,wiki:"https://en.wikipedia.org/wiki/Glasgow_School_of_Art",website:"https://www.gsa.ac.uk",dur:30,price:1},
  {city:"glasgow",cat:"arch",name:"Glasgow Cathedral",desc:"Средневековый собор XII века — единственный на материковой Шотландии, переживший Реформацию. Крипта с «лесом» колонн — мрачно-красиво. Бесплатно. Рядом с Necropolis",lat:55.8632,lng:-4.2489,wiki:"https://en.wikipedia.org/wiki/Glasgow_Cathedral",website:"https://www.glasgowcathedral.org",dur:30,price:1},
  {city:"glasgow",cat:"arch",name:"Университет Глазго",desc:"Неоготический кампус 1870-х — George Gilbert Scott. Говорят, именно он вдохновил Хогвартс (Роулинг жила в Глазго). Cloisters — мрачно-красивые аркады. Hunterian Museum внутри — бесплатно",lat:55.8714,lng:-4.2893,wiki:"https://en.wikipedia.org/wiki/University_of_Glasgow",website:"https://www.gla.ac.uk",dur:30,price:1},
  {city:"glasgow",cat:"arch",name:"City Chambers",desc:"Мраморные интерьеры в стиле итальянского Ренессанса (1888): мраморная лестница, мозаичные потолки, золочёные залы. George Square. Бесплатные экскурсии (пн–пт, 10:30 и 14:30) — одно из самых красивых зданий Шотландии",lat:55.8609,lng:-4.2501,wiki:"https://en.wikipedia.org/wiki/Glasgow_City_Chambers",dur:30,price:1},
  {city:"glasgow",cat:"arch",name:"The Lighthouse",desc:"Первое здание Макинтоша (1895) — бывшая редакция Glasgow Herald. Центр архитектуры и дизайна: выставки + смотровая башня с видом на город. Бесплатно. Макинтош Trail начинается здесь",lat:55.8608,lng:-4.2539,wiki:"https://en.wikipedia.org/wiki/The_Lighthouse_(Glasgow)",website:"https://www.thelighthouse.co.uk",dur:30,price:1},
  {city:"glasgow",cat:"arch",name:"The Willow Tea Rooms",desc:"Чайная, полностью спроектированная Макинтошем в 1903: витражи, стулья с высокими спинками, цветовые схемы. Отреставрирована в 2018. Зайдите на чай с пирожным (£15) — пить чай внутри произведения искусства",lat:55.8636,lng:-4.2597,wiki:"https://en.wikipedia.org/wiki/Willow_Tearooms",website:"https://www.willowtearooms.co.uk",dur:30,price:1},
  {city:"glasgow",cat:"arch",name:"House for an Art Lover",desc:"Нереализованный проект Макинтоша 1901 года — построен в 1996 по его чертежам. Bellahouston Park. Интерьеры тотального дизайна: от дверных ручек до стульев. Кафе в Макинтош-стиле. £6",lat:55.8433,lng:-4.2986,wiki:"https://en.wikipedia.org/wiki/House_for_an_Art_Lover",website:"https://www.houseforanartlover.co.uk",dur:30,price:1},
  {city:"glasgow",cat:"arch",name:"Riverside Museum",desc:"Музей транспорта в здании Захи Хадид: зигзагообразная цинковая крыша — метафора движения. Внутри — локомотивы, трамваи, автомобили, корабли. На реке Клайд стоит парусник Glenlee. Бесплатно",lat:55.8676,lng:-4.3072,wiki:"https://en.wikipedia.org/wiki/Riverside_Museum",website:"https://www.glasgowlife.org.uk/museums/venues/riverside-museum",dur:30,price:1},
  {city:"glasgow",cat:"arch",name:"SEC Armadillo",desc:"Серебристый «панцирь броненосца» на берегу Клайда — концертный зал от Foster + Partners (1997). Внутрь — на концерт, снаружи — для фото. Рядом с Riverside Museum и SSE Hydro",lat:55.8608,lng:-4.2877,wiki:"https://en.wikipedia.org/wiki/SEC_Armadillo",website:"https://www.sec.co.uk",dur:30,price:1},
  {city:"glasgow",cat:"arch",name:"Glasgow Science Centre",desc:"Титановый полумесяц на Pacific Quay: интерактивная наука, IMAX-кинотеатр, вращающаяся башня. Для семей, но взрослым тоже интересно. Рядом с Riverside Museum — совмещайте",lat:55.8583,lng:-4.2886,wiki:"https://en.wikipedia.org/wiki/Glasgow_Science_Centre",website:"https://www.glasgowsciencecentre.org",dur:30,price:1},
  {city:"glasgow",cat:"museum",name:"Kelvingrove Art Gallery and Museum",desc:"Роскошное здание из красного песчаника: Дали (Христос Св. Иоанна), Макинтош, Ренуар, голландские мастера, чучело слона. 22 галереи. Орган играет ежедневно в 13:00. Бесплатно. Лучший музей Глазго",lat:55.8688,lng:-4.2882,wiki:"https://en.wikipedia.org/wiki/Kelvingrove_Art_Gallery_and_Museum",website:"https://www.glasgowlife.org.uk/museums/venues/kelvingrove-art-gallery-and-museum",dur:150,price:0},
  {city:"glasgow",cat:"museum",name:"The Hunterian / Mackintosh House",desc:"Воссозданные интерьеры дома Макинтошей — тотальный дизайн: мебель, витражи, светильники, дверные ручки. Рядом — Hunterian Museum (римские артефакты, минералы, анатомия). Университет Глазго. Бесплатно",lat:55.8726,lng:-4.2908,wiki:"https://en.wikipedia.org/wiki/The_Hunterian",website:"https://www.gla.ac.uk/hunterian",dur:120,price:0},
  {city:"glasgow",cat:"museum",name:"People's Palace & Winter Gardens",desc:"Музей социальной истории Глазго: от ткацких станков до панк-рока. Викторианская оранжерея Winter Gardens — тропические растения в стеклянном дворце. Glasgow Green. Бесплатно",lat:55.8543,lng:-4.2317,wiki:"https://en.wikipedia.org/wiki/People%27s_Palace",website:"https://www.glasgowlife.org.uk/museums/venues/peoples-palace",dur:120,price:0},
  {city:"glasgow",cat:"design_shop",name:"Timorous Beasties",desc:"Текстильный дизайн мирового уровня: классические дамасские узоры, в которые вплетены насекомые, городские пейзажи, сюрреализм. Great Western Road. Подушки, обои, ткани. Шотландский дизайн-бренд №1",lat:55.8773,lng:-4.2983,website:"https://www.timorousbeasties.com",dur:30,price:0},
  {city:"glasgow",cat:"design_shop",name:"Glasgow Print Studio",desc:"Открытая мастерская печатной графики: литография, офорт, цифровая печать. Merchant City. Магазин принтов — можно купить оригинальные работы шотландских художников от £20. Бесплатная галерея",lat:55.8589,lng:-4.2452,website:"https://www.gpsart.co.uk",dur:30,price:0},
  {city:"glasgow",cat:"district",name:"Merchant City",desc:"Торговый квартал XVIII века: warehouse-архитектура, кирпичные фасады. Trongate 103 — 6 этажей мастерских художников (заходите!). Галереи, бары, кафе. Вечером — барная сцена",lat:55.8596,lng:-4.2433,wiki:"https://en.wikipedia.org/wiki/Merchant_City",dur:120,price:0},
  {city:"glasgow",cat:"district",name:"Finnieston",desc:"Самый модный район Глазго: Ox and Finch, The Gannet, Crabshakk — лучшие рестораны города на одной улице. Ретро-мебельные, крафтовые бары. Между центром и Riverside Museum — гуляйте пешком",lat:55.8631,lng:-4.2987,wiki:"https://en.wikipedia.org/wiki/Finnieston",dur:120,price:0},
  {city:"glasgow",cat:"district",name:"SWG3 / The Galvanizers Yard",desc:"Бывший промышленный комплекс → арт-пространство + клуб + галерея. Уникальная геотермальная система: тепло от танцпола обогревает здание. Finnieston. Концерты, выставки, фуд-маркет по выходным",lat:55.8663,lng:-4.3012,website:"https://swg3.tv",dur:120,price:0},
  {city:"glasgow",cat:"district",name:"BAaD — Barras Art and Design",desc:"Креативный хаб на территории легендарного блошиного рынка Barras: мастерские художников, Drygate Brewery (крафтовое пиво), стрит-фуд. Gallowgate. По выходным — живая музыка и маркет",lat:55.8554,lng:-4.2367,website:"https://www.barrasartanddesign.com",dur:120,price:0},
  /* ── GLASGOW · RESTAURANTS ── */
  {city:"glasgow",cat:"restaurant",name:"Ubiquitous Chip",desc:"Шотландская кулинарная легенда с 1971 года: оленина, морепродукты из Западных островов, haggis. Внутренний дворик с виноградом и водопадом. West End, Ashton Lane. Бронируйте. Обед дешевле ужина",lat:55.8730,lng:-4.2895,wiki:"https://en.wikipedia.org/wiki/Ubiquitous_Chip",website:"https://www.ubiquitouschip.co.uk",dur:90,price:2},
  {city:"glasgow",cat:"restaurant",name:"Ox and Finch",desc:"Small plates — шотландские продукты с мировыми влияниями: сашими из лосося, бараньи рёбра, хумус с гранатом. Finnieston. Расслабленная атмосфера, общие столы. Бронировать! £25–35 на человека",lat:55.8635,lng:-4.2963,website:"https://www.oxandfinch.com",dur:75,price:2},
  {city:"glasgow",cat:"restaurant",name:"The Gannet",desc:"Современная шотландская кухня: морские гребешки из Оркнея, оленина из Highlands, сезонные овощи. Michelin Bib Gourmand. Finnieston. Дегустационное меню (£55) — лучший способ. Бронировать за неделю",lat:55.8640,lng:-4.2952,website:"https://www.thegannetgla.com",dur:90,price:2},
  {city:"glasgow",cat:"restaurant",name:"Paesano Pizza",desc:"Лучшая неаполитанская пицца в Шотландии за £7. Тесто на закваске 48 ч, печь 500°C, моцарелла из Италии. Без резерваций — будьте готовы стоять 10–20 мин. Несколько локаций, Miller Street — оригинал",lat:55.8595,lng:-4.2553,website:"https://www.paesanopizza.co.uk",dur:45,price:1},
  {city:"glasgow",cat:"restaurant",name:"Buck's Bar",desc:"Где едят студенты и местные: гигантские бургеры, mac & cheese, крылышки. West End, Ashton Lane. Непафосно, шумно, дёшево (£10–15). Крафтовое пиво. Хороший вариант после Kelvingrove",lat:55.8731,lng:-4.2905,website:"https://www.bucksbar.co.uk",dur:75,price:2},
  {city:"glasgow",cat:"restaurant",name:"Saramago Café Bar",desc:"Веганское кафе в Centre for Contemporary Arts: бранчи, торты, вино. По воскресеньям — pay-what-you-can (платите сколько хотите!). Sauchiehall Street. Галерея наверху — бесплатно",lat:55.8651,lng:-4.2575,website:"https://www.cca-glasgow.com/saramago-cafe-bar",dur:75,price:2},
  {city:"glasgow",cat:"restaurant",name:"Café Gandolfi",desc:"Культовое кафе Глазго с 1979 года: мебель ручной работы Тима Стеда, витражи, тёплая атмосфера. Шотландские завтраки, морепродукты, пироги. Merchant City. Резервировать на ужин",lat:55.8584,lng:-4.2442,website:"https://cafegandolfi.com",dur:60,price:1},
  {city:"glasgow",cat:"restaurant",name:"The 78",desc:"Веганский бар-кафе с живой музыкой: бургеры, пиво, джаз по четвергам. Finnieston. Дёшево (£8–12), расслабленно, дружелюбно. Местная тусовка",lat:55.8639,lng:-4.2969,website:"https://www.the78barandkitchen.com",dur:75,price:2},
  {city:"glasgow",cat:"restaurant",name:"Tantrum Doughnuts",desc:"Лучшие пончики Глазго: необычные вкусы (matcha, bourbon cream, salted caramel pretzel). Shawlands, юг города. Берите 3–4 — пожалеете, если возьмёте один. Маленькая пекарня, всё свежее",lat:55.8277,lng:-4.2838,website:"https://www.tantrumdoughnuts.com",dur:75,price:2},
  {city:"glasgow",cat:"restaurant",name:"Halloumi",desc:"Греческий стритфуд: гиро, сувлаки, халлуми фри, пита с фетой. £7–10. Несколько локаций. Быстро, вкусно, сытно. Средиземноморский перекус между музеями",lat:55.8609,lng:-4.2563,website:"https://www.halloumi.co.uk",dur:75,price:2},
  {city:"glasgow",cat:"restaurant",name:"Singl-end",desc:"Культовые бранчи Глазго: яйца Бенедикт на кукурузном хлебе, панкейки с ягодами, specialty coffee. Garnethill, рядом с School of Art. Очереди по выходным — приходите к 9:00. £10–15",lat:55.8668,lng:-4.2673,website:"https://www.singlend.co.uk",dur:75,price:2},
  /* ── GLASGOW · ART ── */
  {city:"glasgow",cat:"art",name:"Tramway",desc:"Огромное пространство для современного искусства и перформанса в бывшем трамвайном депо 1893 года. Southside, за рекой. Всегда радикальные выставки. Бесплатно. Скрытая жемчужина, мало туристов",lat:55.8299,lng:-4.2625,wiki:"https://en.wikipedia.org/wiki/Tramway_(arts_centre)",website:"https://www.tramway.org",dur:60,price:0},
  {city:"glasgow",cat:"art",name:"GoMA (Gallery of Modern Art)",desc:"Современное искусство в неоклассическом здании. Royal Exchange Square. Бесплатно",lat:55.8608,lng:-4.2494,wiki:"https://en.wikipedia.org/wiki/Gallery_of_Modern_Art,_Glasgow",website:"https://www.glasgowlife.org.uk/museums/venues/goma",dur:60,price:0},
  {city:"glasgow",cat:"art",name:"Street Level Photoworks",desc:"Галерея фотографии: выставки шотландских и международных фотографов, мастерские, тёмная комната. Trongate, Merchant City. Бесплатно. Для любителей фотографии — обязательно",lat:55.8575,lng:-4.2430,website:"https://www.streetlevelphotoworks.org",dur:60,price:0},
  /* ── GLASGOW · NATURE ── */
  {city:"glasgow",cat:"nature",name:"Kelvingrove Park",desc:"Викторианский парк вдоль реки Kelvin: мосты, фонтан, скейт-парк, выход к Kelvingrove Museum. West End. Местные загорают на склонах, студенты устраивают пикники. Совмещайте с музеем и Ashton Lane",lat:55.8710,lng:-4.2879,wiki:"https://en.wikipedia.org/wiki/Kelvingrove_Park",dur:120,price:0},
  {city:"glasgow",cat:"nature",name:"Glasgow Botanic Gardens",desc:"Ботанические сады с Kibble Palace — огромная викторианская оранжерея (1873) с тропическими папоротниками и орхидеями. West End. Бесплатно. Совмещайте с прогулкой по Byres Road (кафе, книжные)",lat:55.8788,lng:-4.2828,wiki:"https://en.wikipedia.org/wiki/Glasgow_Botanic_Gardens",website:"https://www.glasgow.gov.uk/botanicgardens",dur:120,price:0},
  /* ── GLASGOW · MUSIC ── */
  {city:"glasgow",cat:"music",name:"The Old Fruitmarket",desc:"Концертный зал в бывшем фруктовом рынке: чугунные колонны, стеклянная крыша, 1800 мест. Джаз, классика, мировая музыка. Merchant City. Акустика — одна из лучших в Шотландии",lat:55.8586,lng:-4.2472,website:"https://www.glasgowconcerthalls.com/our-venues/old-fruitmarket",dur:150,price:2},
  {city:"glasgow",cat:"music",name:"Nice n Sleazy",desc:"Культовый бар с живой музыкой на Sauchiehall Street: джаз, инди, панк, нойз. Дешёвое пиво (пинта от £4), потные концерты, местная публика. Поздно вечером — здесь начинается ночная жизнь Глазго",lat:55.8648,lng:-4.2621,website:"https://www.nicensleazy.com",dur:150,price:2},
  /* ── GLASGOW · SHOPPING ── */
  {city:"glasgow",cat:"shopping",name:"TK Maxx (Argyle Street)",desc:"Дискаунт брендов: одежда, обувь, сумки со скидкой до -60%. Большой магазин в центре на главной торговой улице. Требует терпения, но находки бывают отличные",lat:55.8572,lng:-4.2550,website:"https://www.tkmaxx.com",dur:45,price:1},
  {city:"glasgow",cat:"shopping",name:"Primark (Argyle Street)",desc:"4 этажа бюджетной одежды. Огромный флагман. Базовые вещи, бельё, домашняя одежда. Центр Глазго, рядом с St Enoch Centre",lat:55.8578,lng:-4.2582,website:"https://www.primark.com",dur:45,price:1},
  {city:"glasgow",cat:"shopping",name:"Starry Starry Night",desc:"Лучший винтажный магазин Глазго: отобранная одежда 1960–1990-х, кожаные куртки, платья, украшения. Dowanside Lane, West End — в тихом переулке рядом с Ashton Lane. Каждая вещь — со своей историей",lat:55.8754,lng:-4.2898,website:"https://www.starrystarrynight.co.uk",dur:45,price:1},
  /* ── GLASGOW · ATTRACTIONS ── */
  {city:"glasgow",cat:"attraction",name:"Necropolis",desc:"Викторианское кладбище на холме за собором: 3500 памятников, 50 000 захоронений. Вид на весь Глазго сверху. Готические мавзолеи, кельтские кресты, ангелы. Тихо, атмосферно, немного жутко. Бесплатно",lat:55.8645,lng:-4.2351,wiki:"https://en.wikipedia.org/wiki/Glasgow_Necropolis",dur:60,price:1},
  {city:"glasgow",cat:"attraction",name:"The Barras Market",desc:"Легендарный блошиный рынок с 1920-х: виниловые пластинки, антиквариат, одежда, абсолютно всё. Сб–вс. Gallowgate. Колоритно, шумно, иногда странно — настоящий Глазго. Рядом с BAaD",lat:55.8548,lng:-4.2368,wiki:"https://en.wikipedia.org/wiki/Barras",dur:60,price:1},
  {city:"glasgow",cat:"attraction",name:"Pollok Country Park",desc:"Огромный парк с Highland cattle (мохнатыми рыжими коровами — фотогеничнейшие существа!). Burrell Collection — 8000 предметов искусства в новом здании (бесплатно). Южный Глазго. Полдня",lat:55.8282,lng:-4.3033,wiki:"https://en.wikipedia.org/wiki/Pollok_Country_Park",website:"https://www.glasgow.gov.uk/pollokpark",dur:60,price:1},
  {city:"glasgow",cat:"attraction",name:"Ashton Lane",desc:"Мощёная улочка в West End: гирлянды фонарей, кино Grosvenor (в здании 1939 года — можно с вином), рестораны с террасами. Деревня внутри города. Вечером — самое романтичное место в Глазго",lat:55.8753,lng:-4.2899,wiki:"https://en.wikipedia.org/wiki/Ashton_Lane",dur:60,price:1},,
{city:"london",cat:"pub",name:"Ye Olde Cheshire Cheese",desc:"Паб с 1667 года, перестроен после Великого пожара. Лабиринт подвалов и каминных залов на 4 уровнях. Здесь пили Диккенс, Твен, Конан Дойл. Тёмный, низкие потолки, камины — настоящий старый Лондон. Fleet Street. Пинта от £6",lat:51.5141,lng:-0.1082,wiki:"https://en.wikipedia.org/wiki/Ye_Olde_Cheshire_Cheese",dur:90,price:1},
  {city:"london",cat:"pub",name:"Princess Louise",desc:"Викторианский gin palace 1872 года: резные перегородки из красного дерева, зеркала в золотых рамах, мозаичный пол, потолок с лепниной. Отреставрирован до последней плитки. Sam Smith's — пинта всего £4. Holborn. Ошеломительный интерьер",lat:51.5185,lng:-0.1210,wiki:"https://en.wikipedia.org/wiki/Princess_Louise_(pub)",dur:90,price:1},
  {city:"london",cat:"pub",name:"The Churchill Arms",desc:"Весь фасад утопает в цветах — сотни горшков, зимой рождественские ёлки. Внутри — мемориалия Черчилля от пола до потолка. Сзади — тайский ресторан (отличный пад-тай за £10). Kensington Church Street. Самый фотогеничный паб Лондона",lat:51.5017,lng:-0.1943,wiki:"https://en.wikipedia.org/wiki/The_Churchill_Arms",dur:90,price:1},
  {city:"london",cat:"pub",name:"Gordon's Wine Bar",desc:"Старейший винный бар Лондона (1890) в подвале: каменные стены, свечи, газетные вырезки на потолке, бочки с хересом. Сырная тарелка + бокал вина у набережной Embankment. Вечером — очередь, приходите к 17:00. Волшебная атмосфера",lat:51.5075,lng:-0.1230,website:"https://www.gordonswinebar.com",dur:90,price:1},
  {city:"london",cat:"pub",name:"Ye Olde Mitre",desc:"Спрятан в переулке между зданиями — найти его половина удовольствия. Построен в 1546 для слуг епископа. Крошечный, уютный, без музыки. В пне у входа — остаток вишнёвого дерева, вокруг которого танцевала Елизавета I. Clerkenwell. Реальный эль",lat:51.5188,lng:-0.1073,wiki:"https://en.wikipedia.org/wiki/Ye_Olde_Mitre",dur:90,price:1},
  {city:"london",cat:"pub",name:"The French House",desc:"Богемный паб Soho: здесь де Голль писал речи, Дилан Томас забывал рукописи, Фрэнсис Бэкон пропивал гонорары. Только полупинты — таковы правила. Маленький, шумный, переполненный характером. Dean Street. Вино лучше, чем пиво",lat:51.5131,lng:-0.1315,wiki:"https://en.wikipedia.org/wiki/The_French_House,_Soho",dur:90,price:1},
  {city:"london",cat:"pub",name:"The Prospect of Whitby",desc:"Старейший речной паб Лондона (1520): деревянный пол, оловянная барная стойка, виселица у воды (пираты). Терраса на Темзе — пить пиво с видом на реку. Wapping. Тёрнер рисовал закаты отсюда. Воскресный роаст отличный",lat:51.5076,lng:-0.0546,wiki:"https://en.wikipedia.org/wiki/Prospect_of_Whitby",dur:90,price:1},

var TRIP_START='2026-06-26',TRIP_END='2026-07-10';
function tripDays(){var days=[],d=new Date(TRIP_START);while(d<=new Date(TRIP_END)){days.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}return days;}
var DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function fmtDay(iso){var d=new Date(iso+'T12:00:00');return DOW[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1);}
function fmtDate(d){if(!d)return'';var p=d.split('-');return p[2]+'.'+p[1];}

var userData={};
function loadUD(){try{var d=localStorage.getItem('uk_map_ud3');if(d)userData=JSON.parse(d);}catch(e){}}
function saveUD(){try{localStorage.setItem('uk_map_ud3',JSON.stringify(userData));}catch(e){}}
function getUD(k){return userData[k]||{};}
function setUD(k,f,v){if(!userData[k])userData[k]={};userData[k][f]=v;saveUD();}
function placeKey(p){return p.name+'|'+p.lat+'|'+p.lng;}

function saveCP(){try{localStorage.setItem('uk_map_cp3',JSON.stringify(customPlaces));}catch(e){}}
function allPlaces(){return PLACES.concat(customPlaces);}

function isMobile(){return window.innerWidth<=768;}
function getLocation(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(function(pos){
    userLat=pos.coords.latitude;userLng=pos.coords.longitude;
    if(document.getElementById('sortSelect').value==='near')render();
  },function(){},{ enableHighAccuracy:true, timeout:5000 });
}
function dist(lat1,lng1,lat2,lng2){
  var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function priceLabel(p){return p===0?'бесплатно':p===1?'£':p===2?'££':'£££';}
function priceBadgeClass(p){return p===0?'badge-free':'badge-price';}
function durLabel(m){return m<60?m+'м':m%60===0?(m/60)+'ч':Math.floor(m/60)+'ч'+m%60+'м';}
function priceEstimate(p){return p===0?0:p===1?10:p===2?30:60;}

/* ── MOBILE VIEW SWITCH ── */
function switchMobileView(view){
  mobileView=view;
  document.getElementById('listPanel').classList.toggle('mob-active',view==='list');
  document.getElementById('calPanel').classList.toggle('mob-active',view==='cal');
  document.querySelectorAll('.tab-bar button').forEach(function(b){b.classList.remove('tab-on');});
  document.getElementById('tab'+view.charAt(0).toUpperCase()+view.slice(1)).classList.add('tab-on');
  if(view==='cal'){calOpen=true;renderCalendar();}
  if(view==='map'){map.invalidateSize();}
}

function init(){
  loadUD();loadCP();
  map=L.map('map',{center:[54.5,-2.5],zoom:6,zoomControl:!isMobile()});
  L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{attribution:'© Google Maps',maxZoom:20,subdomains:['mt0','mt1','mt2','mt3']}).addTo(map);
  if(isMobile()){L.control.zoom({position:'topright'}).addTo(map);}
  map.on('click',onMapClick);
  buildCats();buildCatSelect();getLocation();render();
  window.addEventListener('resize',function(){map.invalidateSize();});
}

function buildCats(){
  var el=document.getElementById('cats');
  Object.keys(CATS).forEach(function(k){
    var v=CATS[k],b=document.createElement('button');
    b.className='cat-chip';b.id='chip-'+k;b.style.borderColor=v.color;b.style.color=v.color;
    b.innerHTML='<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+v.color+';margin-right:2px;vertical-align:1px"></span>'+v.label;
    b.onclick=function(){catClick(k);};
    el.appendChild(b);
  });
}
function catClick(k){
  var keys=Object.keys(CATS);
  var allOn=keys.every(function(c){return activeCats[c];});
  var onlyThisOn=activeCats[k]&&keys.filter(function(c){return activeCats[c];}).length===1;
  if(allOn){
    // Solo mode: show only this category
    keys.forEach(function(c){activeCats[c]=(c===k);});
  }else if(onlyThisOn){
    // If only this one is on, go back to all
    keys.forEach(function(c){activeCats[c]=true;});
  }else{
    // Toggle individual
    activeCats[k]=!activeCats[k];
    // If all turned off, turn all back on
    if(!keys.some(function(c){return activeCats[c];}))
      keys.forEach(function(c){activeCats[c]=true;});
  }
  updateCatChips();render();
}
function catShowAll(){
  Object.keys(CATS).forEach(function(k){activeCats[k]=true;});
  updateCatChips();render();
}
